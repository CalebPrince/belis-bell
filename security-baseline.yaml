      threshold: "Any role change, new admin session from a new device, or sign-in outside working hours"
      route: "belis-bell-owner"
      runbook: "SECURITY.md#admin-compromise"
      status: "PLANNED"
    - id: "MON-003"
      name: "Payment webhook signature failures and amount mismatches"
      source: "webhook handler logs"
      severity: "CRITICAL"
      threshold: "Any invalid signature or mismatch"
      route: "belis-bell-owner"
