monitoring:
  handoff:
    provider: "NONE"
    owner: "belis-bell-owner"
    configuration_status: "NOT_CONFIGURED"
    baseline_version: "0.6.0"
    record_digest: "d60e5d34e8d59b4c57b111cf2476d2ab8614eadd0daa8bc11e76d0c68e5c529e"
    environments: ["staging", "production"]
    handed_off_at: null
    acknowledged_at: null
  signals:
