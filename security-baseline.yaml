      status: "PLANNED"
    - id: "MON-004"
      name: "Unusual price or catalogue changes"
      source: "audit log"
      severity: "HIGH"
      threshold: "Price change above a set percentage, or more than a set number of items in one action"
      route: "belis-bell-owner"
      runbook: "SECURITY.md#price-tampering"
      status: "PLANNED"
