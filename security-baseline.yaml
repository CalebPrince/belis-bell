changes:
  - id: "CHG-001"
    type: "MODIFIED"
    status: "APPROVED"
    security_impact: "HIGH"
    material: true
    targets: ["CTL-AUTH-001", "CTL-AUTH-002", "ID-004", "ID-005", "DEC-003", "THR-022"]
    old_rule: "Staff and owner access requires MFA with a passkey or authenticator app; customers verify email or phone once."
    new_rule: "Customers and staff both sign in with the password plus an emailed one-time code at every sign-in. Registration sends a verification code and a confirmation email. A passkey or authenticator app is recommended for the owner and for export or price-change roles."
    reason: "Owner decision on 2026-09-26 (customer and admin login pages)."
    impact: "An emailed code is only as safe as the mailbox and depends on email delivery. Compensating controls: staff mailboxes need MFA, short-lived single-use hashed codes, attempt limits, no remember-me for staff, uniform error messages, a fresh code for sensitive actions, and monitoring of admin sign-ins (MON-002). Residual risk THR-022 is HIGH until a passkey or authenticator is added."
    approver_required: "Prince Caleb (Super Admin) or the Belis Bell business owner"
  - id: "CHG-002"
    type: "MODIFIED"
    status: "APPROVED"
    security_impact: "HIGH"
    material: true
    targets: ["CTL-PAY-001", "CTL-SET-001", "CTL-AUDIT-001", "THR-023", "DEC-015"]
    old_rule: "Paystack secret keys live only in the server environment file above the web root. Other provider credentials are also file-only."
    new_rule: "Integration credentials are managed by the owner in an admin Settings page and stored encrypted in the database (CTL-SET-001). The environment file keeps the bootstrap values and the master encryption key, and remains the fallback."
    reason: "Owner request on 2026-09-27: keys for Paystack, email SMTP and any other API should be set in the Super Admin settings page."
    impact: "New CRITICAL-impact threat THR-023: taking over the owner account, or reading the database and environment file together, could redirect payments or read a secret. Compensating controls: authenticated encryption, owner-only access, fresh emailed code for every view or change, write-only values, audit log and owner email on every change, live and test key rules, environment fallback. The audit log (CTL-AUDIT-001) must exist at least for settings before this ships. Residual risk MEDIUM, rising to HIGH if the owner mailbox is compromised (THR-022) until a passkey or authenticator is added."
    approver_required: "Prince Caleb (Super Admin) or the Belis Bell business owner"
  - id: "CHG-003"
    type: "ADDED"
    status: "PROPOSED"
    security_impact: "HIGH"
    material: true
    targets: ["CTL-PAY-003", "CTL-AUTHZ-002", "CTL-BIZ-002", "CTL-AUTH-003", "ID-004", "THR-024", "THR-025", "THR-026", "THR-027", "DEC-016"]
    old_rule: "Payments only take money in. Every staff account has one shared level of access. Stock is a label. New passwords are checked against a short built-in list only."
    new_rule: "The owner can refund paid orders through Paystack under CTL-PAY-003. Staff have one of three roles under CTL-AUTHZ-002. Stock is a counted number under CTL-BIZ-002. New passwords are also checked against the Have I Been Pwned range service under CTL-AUTH-003."
    reason: "Owner request and decision on 2026-09-27 (approval of the proposals in docs/PROPOSED-CHANGES.md, with the choices recorded in DEC-016)."
    impact: "Money can now leave the business (THR-024), permissions are split (THR-025), stock decides what can be sold (THR-026), and one more third party is called from the server (THR-027). Compensating controls are in the four new controls, and the existing fresh-code, audit and owner-email patterns are reused."
    approver_required: "Prince Caleb (Super Admin) or the Belis Bell business owner"
