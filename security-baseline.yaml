recovery:
  owner: "belis-bell-owner"
  backup: {status: "REQUIRED", details: "Daily encrypted database and upload backups by scheduled job, copied off the hosting account to separate storage; retention set with DEC-005; host backups are not relied on"}
  restore: {status: "REQUIRED", details: "Restore drill before launch and every 90 days; recovery objectives agreed with the owner"}
  rollback: {status: "REQUIRED", details: "Switch back to the previous release folder or tag; reversible migrations"}
  incident_response: {status: "REQUIRED", details: "Disable the affected route or payment mode, revoke sessions and keys, preserve logs, notify the owner, assess notification duties under the Data Protection Act with qualified advice"}
