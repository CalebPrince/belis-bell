    rationale: "You picked teal earlier and chose Fresh and Bright; keeping the hue keeps Belis Bell distinct from the reference. Superseded: the palette now comes from the logo (PG-031)."
    depends_on: ["PG-025", "PG-010"]
  - id: "PG-028"
    area: "screens"
    title: "Ways-to-shop tiles and category set"
    value: "Three big entry tiles under the product carousels: Shop Products, Buy for Business (quotes) and Washroom Solutions (curated packs for a whole washroom). Core category tiles: Washroom Supplies, Cleaning Chemicals, Cleaning Equipment, Hygiene and Waste, Dispensers and Fittings. Final names come from the real catalogue."
    status: "SUPERSEDED"
    rationale: "Mirrors the reference's three-ways and core-categories blocks for a washroom and cleaning catalogue. Superseded: the mockup uses six category cards and audience cards (PG-033)."
    depends_on: ["PG-026", "PG-018"]
  - id: "PG-029"
    area: "visual"
    title: "Brand colours come from the logo"
    value: "Blue is the single action colour (#006cbc, white text 5.4:1). Deep navy (#044788) is for the announcement bar, footer and headings on tinted bands. Green (#43b14a in the logo) is a brand accent for badges, highlights and illustration only. Text and buttons use a darker green (#2b7d32, white text 5.1:1) because the logo green fails contrast. Teal is dropped."
    status: "SUPERSEDED"
    rationale: "Colours sampled from the supplied logo; the earlier teal pick predates it. Superseded: the mockup uses green for primary buttons (PG-036)."
  - id: "PG-030"
    area: "project"
    title: "Logo supplied"
    value: "Use the updated Belis Bell logo (blue B with cart, spray bottle, soap and tissue; blue and green wordmark; descriptor 'Cleaning Supplies & More'; line 'For homes, businesses and institutions'). Saved as brand/logo-primary.webp; the first version is archived. The header uses a compact lockup and the full logo appears in the footer and about strip. The file is a 1254px raster on white with a light halo, so a transparent PNG or SVG and a horizontal lockup are needed before build."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "You shared an updated logo in chat. Its descriptor now covers cleaning as well as washroom products."
  - id: "PG-031"
    area: "visual"
    title: "Blue, navy and green in the Bright Supply layout"
    value: "Header, buttons and links use blue. The announcement bar and footer use navy. Feature tiles rotate blue, navy, green (#2b7d32) and ink (#0a1d33), each with white text above 4.5:1. Dark theme uses a light blue primary (#6ab7f5) on a deep navy-black ground."
    status: "SUPERSEDED"
