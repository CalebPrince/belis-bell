    depends_on: ["PG-025"]
  - id: "PG-027"
    area: "visual"
    title: "Deep teal takes the place of the reference's navy"
    value: "Header accent, buttons, announcement bar and footer use deep teal (#0a5f61). Feature tiles rotate teal, coral (#b4491f), green (#1f6b3d) and ink (#12303a), each with white text above 4.5:1. Reject this if you want the reference's navy instead."
