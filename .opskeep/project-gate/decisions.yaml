    status: "SUPERSEDED"
    rationale: "Brand answer: starting fresh. Superseded: a logo was supplied (PG-030)."
  - id: "PG-017"
    area: "ux"
    title: "supplymaster.store as structural reference"
    value: "Borrow the structure that works for supply retail: category mega-menu, Buy for Business quote path, delivery and pay-on-delivery messaging, trust counters, FAQ. Do not copy its visual identity, layout details or copy."
    status: "SUPERSEDED"
    rationale: "Given as a note in the workshop. Superseded: you asked to copy the visual style and section arrangement, not just structure (PG-026)."
  - id: "PG-018"
    area: "screens"
    title: "Buy for Business path"
    value: "A dedicated path for institutions: request a quote from a cart or a list, upload a requirements sheet, get a quote thread, then approve it into an order. Repeat orders reuse past quotes."
    status: "CONFIRMED"
    confirmed_via: "explicit"
    rationale: "Institutional supply is half the business and quote-led buying is how institutions procure."
    depends_on: ["PG-001", "PG-006"]
  - id: "PG-019"
    area: "screens"
    title: "Core screen set"
    value: "Home, category, product, search results, cart, checkout, quote request, quote thread, account (orders, saved lists, addresses), order tracking, buying guides, about and contact, FAQ."
    status: "CONFIRMED"
    confirmed_via: "explicit"
    rationale: "Standard store plus the B2B path."
    depends_on: ["PG-001"]
  - id: "PG-020"
    area: "screens"
    title: "Product page built for trust"
    value: "Large photo with zoom, pack size and unit price, stock status, safety and usage notes, downloadable spec or safety data sheet where relevant, WhatsApp button, and add-to-cart plus add-to-quote."
    status: "SUPERSEDED"
