# Generated by Opskeep-project-gate. Change decisions via gate.py, not by hand.
project: "belis-bell"
gate: "approved"
direction: "C - Bright Supply"
decisions:
  - id: "PG-001"
    area: "project"
    title: "Online store for two audiences"
    value: "One store serves everyday buyers and institutional accounts. Same catalogue, different paths: quick checkout for individuals, quotes and account ordering for institutions."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Belis Bell sells washroom and cleaning products and also supplies banks, schools, and government and private companies."
  - id: "PG-002"
    area: "responsive"
    title: "Responsive web, full parity on phone"
    value: "One responsive web app. Phone gets everything the desktop gets: browsing, quotes, checkout, account, order history. No native app in v1."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Used on desktop and phone, and you asked for everything on mobile."
  - id: "PG-003"
    area: "responsive"
    title: "Slow-network tolerance"
    value: "Lean pages, responsive compressed images, skeleton loading, retryable requests, cart and quote drafts that survive a dropped connection."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "You flagged slow or patchy internet."
  - id: "PG-004"
    area: "users"
    title: "Use in the field, on the move and on shared screens"
    value: "Large touch targets, strong contrast and larger base type (17px body). Works at a desk, on a phone in a store room, and projected in an office."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Contexts chosen: desk, on the move, in the field, shared screen, low bandwidth."
    depends_on: ["PG-002"]
  - id: "PG-005"
    area: "users"
    title: "Mixed software comfort"
    value: "Plain language, one clear action per screen, no jargon. Repeat buyers get shortcuts such as reorder and saved lists."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Comfort level: mixed."
  - id: "PG-006"
    area: "ux"
    title: "Conversation-led buying"
    value: "Talking to a person is part of the flow: WhatsApp click-to-chat and call buttons on product and quote pages, and a quote thread that carries messages, not just a form."
    status: "CONFIRMED"
    confirmed_via: "explicit"
    rationale: "Main activity chosen was communicating, with all-day use. Local B2B buying in Ghana often runs through WhatsApp and phone."
  - id: "PG-007"
    area: "ux"
    title: "High-stakes ordering"
    value: "Orders and quotes have a review step, a clear confirmation, an order reference, and an audit trail. Cancelling or editing after submit is deliberate and logged. Undo is not the main safety net."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Mistakes cost money."
  - id: "PG-008"
    area: "visual"
    title: "Trustworthy, friendly, premium tone"
    value: "Calm, reliable and polished, with warm plain-language copy. Premium through restraint and photography, not gold or heavy effects. No em dashes in UI copy."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Feel words chosen: trustworthy, friendly, premium."
  - id: "PG-009"
    area: "visual"
    title: "Editorial visual direction"
    value: "Serif display type for headings, paper-toned neutrals, generous whitespace, product photography treated like magazine pages."
    status: "SUPERSEDED"
