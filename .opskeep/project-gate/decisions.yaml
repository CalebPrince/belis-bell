    depends_on: ["PG-025", "PG-029"]
  - id: "PG-032"
    area: "project"
    title: "Mock data for the first build"
    value: "The first build uses clearly labelled mock data for products, prices (GHS), stock, categories, brands, delivery figures, the trust counter and customer content. Mock data lives in one seed file, is never presented as real, and is removed before launch. Payments run in provider test mode only until the security gate signs off live keys."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "You asked to use mock data for prices, products and everything else for now."
    depends_on: ["PG-024"]
  - id: "PG-033"
    area: "screens"
    title: "Home page structure follows the owner's mockup"
    value: "Sections in this order: (1) header; (2) hero with a small eyebrow label, a three-line two-tone headline, one supporting sentence, two buttons (Shop Now, For Businesses) and a row of four trust points (Fast delivery across Ghana, Quality products, Trusted support, Secure payments); (3) Explore Our Range: six category cards, each with a photo, name and an arrow; (4) a blue promo banner with headline, one sentence, a Shop Now button and a photo on the right; (5) Solutions for Every Space: three audience cards (Homes, Businesses, Institutions) with a photo, icon, title and one line; (6) Popular Products: a carousel of product cards with price and Add to Cart; (7) Why Choose Belis Bell: four points with icons (Quality Brands, Fast Delivery, Great Value, Dedicated Support); (8) a second banner, Clean Spaces Start Here, with Shop Now and Contact Us; (9) footer."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner as a home page mockup. The mockup gives structure only; the owner supplies all images."
  - id: "PG-034"
    area: "ux"
    title: "Header, navigation and footer follow the mockup"
    value: "Header: logo on the left, six text links (Home, Shop, Categories, For Businesses, About, Contact) and three icon buttons (Search, Account, Cart with a count). On phones the links move into a menu. Footer: logo and tagline with social icons, then Quick Links, Customer Support and Contact columns, then a copyright line with Privacy Policy and Terms links."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Shown in the owner's mockup."
    depends_on: ["PG-002"]
  - id: "PG-035"
    area: "visual"
    title: "The owner supplies all imagery"
    value: "Photos and illustrations are supplied by the owner. The site is built with named image slots (listed in docs/IMAGES.md) and neutral placeholders until each image arrives. No images are generated by the developer, and none are taken from other websites. Photos that show other companies' branded packaging need the owner's confirmation that showing them is allowed."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Owner: 'I will supply the visuals images I want'. The mockup shows recognisable third-party brand packs, which need rights confirmed."
  - id: "PG-036"
    area: "visual"
    title: "Visual style follows the mockup, with an accessible green"
    value: "Light page with white and very pale blue-grey surfaces; rounded cards (16px) with a soft shadow; pill-shaped buttons, filled green for the main action and white with a navy outline for the second; headlines in navy with blue and green emphasis words; small spaced-out capital eyebrow labels; deep navy banners (#00346e and #002b61) with the photo on the right; deep navy footer (#001b38). The main button green is #2b7d32 with white text (5.1:1), because the mockup's bright green #3fa80c fails contrast with white text (3.1:1). Blue #006cbc is for links and small accents. The logo's bright green is for icons and highlights only. Dark theme stays."
    status: "CONFIRMED"
    confirmed_via: "explicit"
    rationale: "Colours sampled from the mockup, adjusted for WCAG AA."
    depends_on: ["PG-033"]
  - id: "PG-037"
    area: "screens"
    title: "Structure pages for the navigation"
    value: "Build the pages the navigation points to as structure with clearly labelled mock text: Categories (all categories), For Businesses (how quotes work, audience cards, a Request a quote button that is switched off until the quote flow is built), About, and Contact (details plus a WhatsApp link; no form yet). Footer links to FAQ, Shipping and Delivery, Returns and Refunds, Payment Methods, Track Order, Privacy Policy and Terms appear only when the page has real content. Social icons appear only with real links. The address, phone, email and opening hours in the mockup are treated as mock until supplied."
    status: "CONFIRMED"
    confirmed_via: "explicit"
    rationale: "Every nav link should go to a real page, and policy and legal text needs real content from the owner."
    depends_on: ["PG-033", "PG-034"]
  - id: "PG-038"
    area: "ux"
    title: "Promises in the trust row are the owner's to confirm"
    value: "The trust row and the Why Choose section make promises: fast delivery across Ghana, quality brands, great value, dedicated support and secure payments. Shown as mock copy until the owner confirms each is true. Secure payments is shown only once Paystack live payments are approved."
    status: "CONFIRMED"
    confirmed_via: "explicit"
    rationale: "Claims must be things Belis Bell can keep."
    depends_on: ["PG-033"]
  - id: "PG-039"
    area: "screens"
    title: "Product page follows the owner's mockup"
    value: "Breadcrumb (Home, Shop, category, product). Left: a photo gallery with a vertical strip of thumbnails beside one large photo that has an expand button. Right: category label, product name, short description, price, Size options with a price each, quantity stepper, a large green Add to Cart button, a save-for-later heart, and the trust row. Below that, a highlights box with three benefits. Then tabs (Description, Specifications, How to Use, Delivery & Returns) with a Key Features list, a You May Also Like panel with a View All link, and a Common Uses strip of five photo tiles. The WhatsApp link, add-to-quote and downloadable data sheet (where one exists) from the earlier product page decision stay."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner as a product page mockup. Structure only; the owner supplies all photos."
    depends_on: ["PG-035"]
  - id: "PG-040"
    area: "ux"
    title: "Products can have several sizes"
    value: "A product can offer several sizes (for example 1 litre, 5 litres, 20 litres), each with its own price and stock status. Choosing a size updates the price shown. The server sets every price and total; the page never decides them (CTL-BIZ-001). Sizes are shown but Add to Cart stays switched off until the cart is built."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "The mockup shows three sizes with a price each."
    depends_on: ["PG-039"]
  - id: "PG-041"
    area: "ux"
    title: "Ratings, review counts and sold counts are not shown yet"
    value: "The mockup shows a star rating, a review count and a '500+ sold' figure. These are not shown until a real reviews system exists, because they would otherwise be made up. A reviews system needs its own security review (moderation, abuse, fake reviews) and would change the security baseline. Benefit claims such as 'Kills 99.9% of germs' come from the supplier's data sheet and show as mock text until the owner confirms them (PG-038)."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Claims and social proof must be true and traceable."
    depends_on: ["PG-039", "PG-038"]
  - id: "PG-042"
    area: "screens"
    title: "How bulk purchases work"
    value: "Both. The product page has a bulk panel with quantity price tiers where Belis Bell sets them (mock tiers until supplied), an estimated total for a chosen quantity, and always a Request bulk quote button (the quote flow is not built yet, so the button is switched off). The server sets every price and total (CTL-BIZ-001)."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Decides whether the product page shows quantity price tiers, a quote request, or both. Tier prices are business numbers only Belis Bell can set."
    depends_on: ["PG-039", "PG-018"]
  - id: "PG-043"
    area: "screens"
    title: "Extra product content and Common Uses photos"
    value: "Each product can carry a full description, specifications, how to use, key features, three highlights and a list of common uses. Delivery and Returns text is the same for every product and comes from the owner. Common Uses tiles use owner photos named by use (laundry, bathrooms, kitchens, floors, bins), shared across products. All of this is mock text until supplied. The download of a data sheet appears only when a file exists."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "The mockup shows these tabs and tiles."
    depends_on: ["PG-039", "PG-035"]
  - id: "PG-044"
    area: "ux"
    title: "Header shows a search field on wide screens"
    value: "On wide screens the header shows a search field between the links and the account and cart icons, as in the product mockup. On small screens it stays an icon. Search itself is not built yet, so the field is switched off."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "The product mockup header differs slightly from the home mockup."
    depends_on: ["PG-034"]
  - id: "PG-045"
    area: "screens"
    title: "Shop page structure follows the owner's mockup"
    value: "Header, then a hero banner (eyebrow 'Cleaning Supplies & More', title 'Shop Our Products', one sentence, a trust row, and a photo that fades in from the left). Below it a two-column layout. Left: a filter panel with Categories (each with a product count), Price Range (min and max in GHS with an Apply button), Availability (In Stock, Out of Stock, with counts), Brand (with counts) and Clear Filters. Right: a bar with 'Showing 1 to 12 of N products' and a Sort by menu, a product grid four across on desktop (12 per page), and numbered pagination with previous and next. Last, a trust strip of five points (Fast Delivery, Quality Products, Trusted Support, Secure Payments, Great Value). On phones the filter panel opens from a Filters button above the grid and the grid is two across."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner as a shop page mockup. Structure only; the owner supplies all photos."
    depends_on: ["PG-035"]
  - id: "PG-046"
    area: "ux"
    title: "Shop filters work on the server and keep their state in the address"
    value: "Category, price range, availability, brand and sort combine. Every choice is checked on the server, so odd values fall back to safe defaults. The address keeps the filters, so a filtered page can be shared or bookmarked and works without JavaScript. Counts beside each option come from the catalogue. Clear Filters resets everything. Page size is 12."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Filters in the mockup need real, checkable behaviour."
    depends_on: ["PG-045"]
  - id: "PG-047"
    area: "ux"
    title: "No star ratings or rating filter; brand filter only with brand data"
    value: "The mockup shows star ratings, review counts and a rating filter. These stay out until a real reviews system exists (PG-041). The Brand filter appears only when products carry a brand. The catalogue gets an optional brand field; the mock catalogue uses invented brand names from the mockup. Real brands come from the owner, and photos of other companies' brands need permission (PG-035)."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "No made-up social proof; no filters without data."
    depends_on: ["PG-045", "PG-041"]
  - id: "PG-048"
    area: "ux"
    title: "Shop card extras"
    value: "Cards show photo, name, size, price and a stock badge with an icon. The heart (save for later) and Add to Cart are shown but switched off until the cart and saved lists are built. The small quantity stepper in the mockup is left off cards until the cart exists; the product page has one."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Avoid controls on cards that cannot do anything yet."
    depends_on: ["PG-045"]
  - id: "PG-049"
    area: "screens"
    title: "Shop trust rows are the owner's promises"
    value: "The hero trust row and the bottom strip (including 'Great Value: Competitive prices') are promises. They show as mock copy until the owner confirms each one, and Secure Payments appears only once live payments are approved (PG-038)."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Claims must be things Belis Bell can keep."
    depends_on: ["PG-045", "PG-038"]
  - id: "PG-050"
    area: "screens"
    title: "Category page structure follows the owner's mockup"
    value: "Breadcrumb (Home, Shop, category); a category hero with the category name, a description, four trust points and a photo that fades in from the left; a left panel headed with the category name that lists 'All <category>' plus its subcategories with counts, then Price Range, Availability and Brand; a bar with 'Showing 1 to 12 of N products' and Sort by; the product grid (two across on phones, three on tablets, four on desktop, six on very wide screens; 12 per page); and a closing strip 'Why Choose Our <category>' with four points."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner as a category page mockup."
    depends_on: ["PG-045"]
  - id: "PG-051"
    area: "ux"
    title: "Categories can have subcategories"
    value: "A category can have subcategories, one level deep, each with its own product count. The category page lists them in the filter panel and filters by the chosen one. The mock catalogue uses the subcategory names from the mockup for Cleaning Products only. Real subcategories come from the owner."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "The category mockup shows subcategories inside the filter panel."
    depends_on: ["PG-050"]
  - id: "PG-052"
    area: "screens"
    title: "Cart page structure follows the owner's mockup"
    value: "Breadcrumb (Home, Shop, Cart); title 'Your Shopping Cart' with a Continue Shopping link; an items table (remove icon, photo, name, size, stock, unit price, quantity stepper, line total); an Order Summary card (subtotal with item count, delivery fee with an info tip, total) with ONE green 'Proceed to Checkout' button. The 'Pay with Mobile Money' button from the mockup is not built. Below the summary: a Delivery Information box and a Secure Payments box with a row of payment channel logos. Then a trust row and a 'You May Also Like' panel of four products with a View All Products link."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner. The owner asked to leave out the Pay with Mobile Money button."
    depends_on: ["PG-035"]
  - id: "PG-053"
    area: "screens"
    title: "Checkout page: sign-in required, pay through Paystack"
    value: "No guest checkout: a customer must be signed in, and 'Proceed to Checkout' sends anyone who is not to sign in and then back. The page has a progress bar (Shopping Cart, Checkout, Payment, Confirmation) and three sections: Contact Information (name, phone with country code, email), Delivery Address (Home, Business or Institution; region; city or town; area; address details; optional notes) and Delivery Option (Standard or Express). The Payment Method section from the mockup is not built. The sidebar has the order summary with an Edit Cart link, a trust box and a WhatsApp help box. The final green button reads 'Pay with Paystack': it creates the order and sends the customer to Paystack's own payment page, where they choose mobile money or card. No payment details are ever entered on our pages (CTL-PAY-001)."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner, who ruled out guest checkout and the payment method section."
    depends_on: ["PG-022", "PG-052"]
  - id: "PG-054"
    area: "ux"
    title: "Delivery rules are mock until supplied"
    value: "The regions and towns lists, Standard delivery at GHS 20.00 (1 to 3 working days in Accra, 2 to 5 elsewhere) and Express at GHS 40.00 (same day in Accra, order before 12pm) are mock until Belis Bell supplies real rules. The server sets the delivery fee from the address and option (CTL-BIZ-001). The 'agree to Terms and Privacy Policy' line appears only once those pages exist with real text (DEC-005)."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Delivery fees and legal text are the owner's to set."
    depends_on: ["PG-053"]
  - id: "PG-055"
    area: "screens"
    title: "Order confirmation page structure follows the owner's mockup"
    value: "A thank-you header with the customer's name and where updates will be sent; four detail tiles (order number, date, payment method, delivery method); an Order Tracking panel with five steps; four action buttons (View Order Details, Download Invoice, Track Order, Continue Shopping); an Order Summary with the order number and 'Total Paid'; a payment box; and a row of four cards (Delivery Information, Need Help, Business Customer with a Request a Quote button, Continue Shopping). The page also has states for payment pending, failed and cancelled. 'Total Paid' and 'Payment Successful' appear only after the payment is confirmed with Paystack, and the payment method shown is what Paystack reports. Only the customer who owns the order can see it."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner."
    depends_on: ["PG-053"]
  - id: "PG-056"
    area: "ux"
    title: "Order updates and tracking"
    value: "Updates go by email. The 'Get Updates on WhatsApp' button opens a click-to-chat with the order number (DEC-008); automatic WhatsApp messages need the WhatsApp Business API and would be a separate security change. The five tracking steps are moved by staff in the admin (not built yet); until then the page shows only the steps the system knows (Order Received, Payment Confirmed). 'Download Invoice' is left out until Belis Bell supplies its business and tax details."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Keeps to the approved WhatsApp decision and avoids invented tax information."
    depends_on: ["PG-055"]
  - id: "PG-057"
    area: "screens"
    title: "Account dashboard structure follows the owner's mockup"
    value: "A left sidebar with the customer's name and email, then Dashboard, My Orders, My Addresses, Saved Products, Reorder, Quotes & Bulk Orders, Invoices, Account Details, Payment Methods, Notifications and Log Out. The dashboard shows a Request a Quote banner; four tiles (Total Orders, Total Spent, Saved Products, Repeat Orders); Recent Orders with a status pill and View Details; Saved Products with Add to Cart; My Addresses with a default marker and Manage Addresses; Quick Actions; and Account Details (name, email, phone, account type, member since)."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner."
    depends_on: ["PG-053"]
  - id: "PG-058"
    area: "ux"
    title: "Account scope for the first version"
    value: "Payment Methods is not built: payment details stay with Paystack (CTL-PAY-001), and customers choose how to pay on Paystack's page each time. Recurring orders are left for later; version one has one-click Reorder. Account type is Individual or Business, chosen at sign-up (PG-067); institutions still request a quote each time, and staff link an organisation only when repeat buyers need shared access (PG-023). Invoices and Notifications pages appear once there is real content (tax details, email preferences). Total Spent counts only orders whose payment was confirmed."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Keeps the account within the approved security design."
    depends_on: ["PG-057"]
  - id: "PG-059"
    area: "visual"
    title: "Payment channel logos are official marks supplied by the owner"
    value: "The row of payment logos (MTN MoMo, Telecel Cash, AirtelTigo Money or AT Money, Visa, Mastercard) uses the official marks, supplied by the owner or from the brands' official brand pages with the owner's agreement, saved as `payments/<name>` slots. Only channels enabled on the Belis Bell Paystack account are shown, using the names the Paystack account shows. Nothing is drawn or recreated. Vodafone Cash is not shown (now Telecel Cash)."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Brand marks carry usage rules and must match the real account."
    depends_on: ["PG-052", "PG-035"]
  - id: "PG-060"
    area: "screens"
    title: "Admin dashboard structure follows the owner's mockup"
    value: "A dark navy left sidebar (Dashboard, Orders with a count badge, Products with All Products, Categories, Inventory and Product Reviews, Customers, Quotes & Bulk Orders with a badge, Promotions, Content, Reports, Delivery & Logistics, Payments, Users & Roles, Settings) with an Online Store link at the bottom. A top bar with a search field for orders, products and customers, a notifications bell, and the signed-in person's name and role. The page has a title, a welcome line and a date range picker; five stat tiles (Total Orders, Total Revenue, Customers, Products, Low Stock Items) each with a change against the previous month; a Sales Overview line chart (revenue and orders); an Order Status donut with Pending, Processing, Dispatched, Delivered and Cancelled counts; Quick Actions (Add New Product, Create Promotion, View Orders, Generate Report, Manage Delivery Areas, Store Settings); a Recent Orders table; and a Low Stock Products table."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner as an admin dashboard mockup."
    depends_on: ["PG-035"]
  - id: "PG-061"
    area: "ux"
    title: "Admin first-version scope and roles"
    value: "Build order: Orders, Products and Inventory, Quotes & Bulk Orders, Customers, Users & Roles, then Delivery & Logistics (checkout needs delivery areas). Payments is a read-only view of Paystack transactions. Promotions, Content and Reports come later, and Product Reviews is left out because there is no reviews system (PG-041). Menus and pages depend on the role (owner, sales, fulfilment, content, DEC-007). Total Revenue, the sales chart, Users & Roles and Settings are owner-only. Exports are limited, logged and approved by the owner. Figures count only orders whose payment was confirmed. The profile shows the person's own role."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Keeps the admin inside the approved security design and the real build order."
    depends_on: ["PG-060"]
  - id: "PG-062"
    area: "screens"
    title: "Admin login page structure follows the owner's mockup"
    value: "A split screen. Left: a navy panel with the logo, an 'Admin Portal' label, a headline, a short list of what the admin does, and a secure-access note over a photo. Right: a Back to Website link, the logo, 'Admin Login', an email field, a password field with a show and hide control, a green Sign In button, and an 'Authorized Access Only' notice."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner as an admin login mockup."
    depends_on: ["PG-035"]
  - id: "PG-063"
    area: "ux"
    title: "Admin sign-in rules"
    value: "No Remember me and no Continue with Google on the admin login, because staff sessions are short by design and a third-party sign-in would change the security design. Forgot password is owner-only: staff ask the owner to reset their access. After the password, staff enter an emailed code as customers do (PG-069). The page is not linked from the storefront. The left panel lists only what is built, and the secure-access note states something specific and true, such as that every sign-in is confirmed with an emailed code and sessions expire quickly."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Matches the approved security baseline (CTL-AUTH-002, CTL-SESS-001)."
    depends_on: ["PG-062"]
  - id: "PG-064"
    area: "screens"
    title: "Customer login: email and password, then an emailed code"
    value: "A split screen like the admin login. Right side: a 'Customer Login' label, 'Welcome back!', an email field, a password field with a show and hide control, Forgot password, a green Sign In button, and a 'Create an Account' card. After the email and password, the customer receives a 6-digit verification code by email and enters it to finish signing in. A code lasts 10 minutes, works once, allows 5 wrong tries, and a new one can be requested after a short wait. Only a scrambled form of each code is stored. Wrong email, password or code all give the same kind of message."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner, who asked for email verification codes on login."
    depends_on: ["PG-053"]
  - id: "PG-065"
    area: "ux"
    title: "Customer sign-in details"
    value: "A code is required at every sign-in, and 'Remember me' is not shown; a 'trust this device for 30 days' option can replace it if the owner wants fewer codes. Continue with Google and Continue with Apple are left out for now, since they add outside companies as ways in and email codes already cover the need. Email delivery must work (SPF, DKIM and DMARC, CTL-ACCT-001), with a resend button and a Chat on WhatsApp link for people who do not get the code. The panel text is specific and true (for example 'Sign-ins are confirmed with an email code'), and the Exclusive Offers line is left out because promotions are not in the first version."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Keeps the sign-in within the approved security design."
    depends_on: ["PG-064"]
  - id: "PG-066"
    area: "screens"
    title: "Register page structure follows the owner's mockup"
    value: "A split screen. Right side: a three-step progress bar (Account Type, Your Details, Complete); 'Create Your Account'; two account type cards, Individual and Business; Personal Information (full name, email, phone with +233, password with a show and hide control and a hint); Delivery Information (region, city or town, delivery address); an agree-to-terms tick box; a green Create Account button; and 'Already have an account? Sign In'. Step three is entering the emailed verification code."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Supplied by the owner as a register page mockup."
    depends_on: ["PG-064"]
  - id: "PG-067"
    area: "ux"
    title: "Register details"
    value: "Business is chosen by the person and starts as unverified: no shared access or special pricing until staff confirm the organisation (CTL-ORG-001), and a Business sign-up also asks for the organisation's name. Passwords need at least 10 characters with no forced symbols, are checked against known leaked passwords and allow passphrases, instead of the mockup's 8 characters with a mix. Delivery information is not asked at sign-up: it is asked at checkout and saved in My Addresses, which collects less personal data. The terms tick box appears only once the Terms and Privacy Policy pages exist with real text (PG-054, DEC-005). The phone number is collected, but only the email is verified for now."
    status: "CONFIRMED"
    confirmed_via: "gate_approval"
    rationale: "Follows the approved security design and the Data Protection Act principle of collecting only what is needed."
    depends_on: ["PG-066"]
  - id: "PG-068"
    area: "ux"
    title: "Register sends confirmation emails"
    value: "Registering sends two emails. First, the verification code email for step three of the register page (the account is not usable until the code is entered). Second, once the code is confirmed, a confirmation email that says the account is ready, shows the name and email used, how to sign in, and how to contact Belis Bell. Emails never contain a password or a sign-in code in the confirmation, and they carry no links that sign someone in."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Owner asked for confirmation emails on register."
    depends_on: ["PG-066"]
  - id: "PG-069"
    area: "ux"
    title: "Admins also sign in with an emailed code"
    value: "Staff and the owner sign in with email and password and then an emailed 6-digit code, the same steps as customers. For staff a code lasts 5 minutes, works once, allows 5 wrong tries, and only a scrambled form is stored. This replaces the passkey or authenticator second step in the approved security baseline, which therefore needs a change and reapproval (baseline 0.4.0). A passkey or authenticator app for the owner account is recommended later, because an emailed code is only as safe as the mailbox that receives it."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Owner instruction: admin also gets email verification codes on login."
    depends_on: ["PG-062", "PG-064"]
