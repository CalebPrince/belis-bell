  - id: "PG-025"
    area: "visual"
    title: "Supply Master visual language"
    value: "Adopt the reference's visual style: deep-toned header, footer and buttons on a light page, a photo-led hero with dark overlay and large white headline, coloured feature tiles with photos, rounded (12px) buttons and cards, product carousels with a full-width add-to-cart button, Figtree-style semibold headings, generous section titles centred over light grey-tinted bands. Belis Bell's own palette, logo, photography and copy are used throughout."
    status: "SUPERSEDED"
