  - id: "PG-026"
    area: "ux"
    title: "Section arrangement follows the reference"
    value: "Home and category pages keep the reference's section order and rhythm (see PG-014). No text, product photos, logos, brand names or partner names are copied. Nothing implies affiliation with Supply Master."
    status: "SUPERSEDED"
