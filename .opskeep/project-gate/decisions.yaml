  - id: "PG-010"
    area: "visual"
    title: "Teal accent"
    value: "Teal is the single accent for primary buttons, links and focus. Status colours stay separate. Every teal used for text or buttons meets 4.5:1."
    status: "SUPERSEDED"
    rationale: "Teal picked; suits water, cleanliness and hygiene. Superseded: the supplied logo sets the brand colours (PG-029)."
  - id: "PG-011"
    area: "visual"
    title: "Soft elevated surfaces"
    value: "Product cards, quote panels and summary boxes sit on soft shadows. Elevation is reserved for things you act on; page sections stay flat."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Soft elevation picked."
  - id: "PG-012"
    area: "visual"
    title: "Light and dark themes"
    value: "Follows the device. Light is the designed default (paper-toned); dark is a full second palette, not an inversion."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Both themes chosen."
  - id: "PG-013"
    area: "ux"
    title: "Top bar with mega-menu navigation"
    value: "Sticky top bar: logo, search, account, cart, and a Buy for Business link. A category mega-menu on desktop; a full-screen category drawer on phone. No sidebar."
    status: "SUPERSEDED"
    rationale: "Top bar chosen; the reference site uses a category mega-menu for a large catalogue. Superseded: the owner mockup sets the header and navigation (PG-034)."
    depends_on: ["PG-002"]
  - id: "PG-014"
    area: "screens"
    title: "Content mix: photos, product grids and copy"
    value: "Home follows a fixed section order: announcement bar, header, nav row, split hero (photo with headline beside a 2x2 cluster of coloured feature tiles), category pill tabs, product carousels, brand spotlight, three ways to shop tiles, core category tiles, featured partner picks, trust counter, brand in focus, all brands A to Z, footer. Buying guides and hygiene advice sit as a lower strip. Copy and images are Belis Bell's own."
    status: "SUPERSEDED"
    rationale: "Section arrangement taken from the reference at your request; content is original. Superseded: the owner mockup sets the home page structure (PG-033)."
    depends_on: ["PG-025"]
  - id: "PG-015"
    area: "accessibility"
    title: "WCAG 2.2 AA plus extended needs"
    value: "AA baseline with full keyboard operation, screen-reader labelling and live regions for cart and quote changes, a low-vision mode (text scaling to 200% without breakage, no reliance on colour), and layouts that tolerate text expansion and RTL."
    status: "CONFIRMED"
    confirmed_via: "interview"
    rationale: "Keyboard, screen reader, low vision and multi-language needs all selected."
  - id: "PG-016"
    area: "project"
