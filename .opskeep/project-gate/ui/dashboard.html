<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

function lum(hex) {
  const h = String(hex).replace('#', '');
  const f = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const v = [0, 2, 4].map(i => parseInt(f.substr(i, 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4));
  return .2126 * v[0] + .7152 * v[1] + .0722 * v[2];
}

/* Wireframe preview drawn from a small spec: nav, density(1-3), radius, surface, palette, serif/mono, title */
function miniPreview(s) {
  s = s || {};
  const P = Object.assign({bg:'#f6f7f9', surface:'#ffffff', accent:'#2f6feb', ink:'#1b1f24', line:'#dfe3e8'}, s.palette || {});
  const W = 200, H = 125;
  const r = Math.max(0, Math.min(s.radius == null ? 6 : s.radius, 14));
  const nav = s.nav || 'top', dens = s.density || 2, surf = s.surface || 'flat';
  const f = (x, y, w, h, fill, o) => {
    o = o || {};
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r || 0}" fill="${fill}"` +
      (o.stroke ? ` stroke="${o.stroke}" stroke-width="1"` : '') + (o.op != null ? ` opacity="${o.op}"` : '') + '/>';
  };
  let g = f(0, 0, W, H, P.bg, {r: 6});
  let x0 = 10, y0 = 10, x1 = W - 10, y1 = H - 10;
  if (nav === 'sidebar') {
    g += f(0, 0, 36, H, P.surface, {stroke: P.line}) + f(8, 10, 10, 10, P.accent, {r: 3});
    for (let i = 0; i < 5; i++) g += f(8, 30 + i * 13, 20, 5, P.ink, {r: 2, op: i === 1 ? .9 : .25});
    x0 = 46;
  } else if (nav === 'top') {
    g += f(0, 0, W, 18, P.surface, {stroke: P.line}) + f(8, 5, 8, 8, P.accent, {r: 3});
    for (let i = 0; i < 3; i++) g += f(60 + i * 22, 7, 16, 4, P.ink, {r: 2, op: i === 0 ? .9 : .25});
    y0 = 26;
  } else if (nav === 'tabs') {
    g += f(0, H - 20, W, 20, P.surface, {stroke: P.line});
    for (let i = 0; i < 4; i++) g += f(24 + i * 40, H - 13, 10, 6, i === 0 ? P.accent : P.ink, {r: 2, op: i === 0 ? 1 : .3});
    y1 = H - 28;
  }
  const font = s.serif ? 'Georgia,serif' : (s.mono ? 'ui-monospace,Menlo,monospace' : 'system-ui,sans-serif');
  g += `<text x="${x0}" y="${y0 + 11}" font-family="${font}" font-size="12" font-weight="700" fill="${P.ink}">${esc((s.title || 'Aa').slice(0, 14))}</text>`;
  g += f(x1 - 26, y0 + 1, 26, 10, P.accent, {r: Math.min(r, 5)});
  const cy = y0 + 20, ch = y1 - cy;
  if (dens === 3) {
    const n = Math.max(3, Math.floor(ch / 11));
    for (let i = 0; i < n; i++) {
      const y = cy + i * 11;
      g += f(x0, y, x1 - x0, 9, i === 0 ? P.line : P.surface, {r: Math.min(r, 3), stroke: P.line});
      g += f(x0 + 4, y + 3, 18 + ((i * 7) % 14), 3, P.ink, {r: 1, op: .55}) + f(x0 + 70, y + 3, 24, 3, P.ink, {r: 1, op: .25});
      g += f(x1 - 24, y + 3, 14, 3, P.accent, {r: 1, op: i % 2 ? .5 : .9});
    }
  } else {
    const cols = dens === 2 ? 3 : 2, gap = dens === 2 ? 6 : 10, rows = dens === 2 ? 2 : 1;
    const cw = (x1 - x0 - gap * (cols - 1)) / cols, h = (ch - (rows - 1) * gap) / rows;
    for (let rr = 0; rr < rows; rr++) for (let c = 0; c < cols; c++) {
      const x = x0 + c * (cw + gap), y = cy + rr * (h + gap);
      if (surf === 'elevated') g += f(x, y + 2, cw, h, '#000', {r: r, op: .12}) + f(x, y, cw, h, P.surface, {r: r});
      else if (surf === 'open') g += f(x, y, cw, 2, P.ink, {op: .6});
      else g += f(x, y, cw, h, P.surface, {r: r, stroke: P.line});
      g += f(x + 6, y + 8, cw * .5, 3, P.ink, {r: 1, op: .7}) + f(x + 6, y + 15, cw * .75, 3, P.ink, {r: 1, op: .25});
      if (h > 34) g += f(x + 6, y + h - 14, cw * .3, 6, P.accent, {r: Math.min(r, 3)});
    }
  }
  return `<svg class="mini" viewBox="0 0 ${W} ${H}" role="img" aria-label="Layout preview">${g}</svg>`;
}

/* Result hand-off: always selectable text + copy + download, because sandboxes may block either. */
function resultPanel(obj, o) {
  const txt = JSON.stringify(obj);
  return `<section class="result" aria-live="polite"><h3>${esc(o.title)}</h3><p class="hint">${esc(o.lead)}</p>` +
    `<textarea id="result-json" readonly rows="6" aria-label="Response to paste back to Claude">${esc(txt)}</textarea>` +
    `<div class="row"><button type="button" class="btn primary" data-a="copy">Copy</button>` +
    `<button type="button" class="btn" data-a="download" data-f="${esc(o.filename)}">Download .json</button></div>` +
    `<p class="hint" id="copy-hint" style="margin-top:8px"></p></section>`;
}
function hintMsg(m) { const e = $('#copy-hint'); if (e) e.textContent = m; }
async function copyResult() {
  const t = $('#result-json'); if (!t) return;
  try { await navigator.clipboard.writeText(t.value); hintMsg('Copied. Paste it back to Claude.'); }
  catch (e) { t.focus(); t.select(); try { document.execCommand('copy'); hintMsg('Copied. Paste it back to Claude.'); } catch (_) { hintMsg('Select the text above and copy it.'); } }
}
function downloadResult(name) {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([$('#result-json').value], {type: 'application/json'}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    hintMsg('Downloaded. If nothing saved, copy the text instead.');
  } catch (e) { hintMsg('Download is blocked here. Copy the text instead.'); }
}

</script>
<script>
const S = DATA.state, H = DATA.base_hash, KEY = 'pg-dash:' + H;
const LABEL = {CONFIRMED:'Confirmed', INFERRED:'Inferred', PROPOSED:'Proposed', NEEDS_INPUT:'Needs input', REJECTED:'Rejected', SUPERSEDED:'Superseded'};
const AREAS = [['project','Project'],['users','Users & jobs'],['ux','UX decisions'],['screens','Screen architecture'],['visual','Visual direction'],['responsive','Responsive strategy'],['accessibility','Accessibility']];
const W = {CONFIRMED:1, INFERRED:.75, PROPOSED:.5, NEEDS_INPUT:0, REJECTED:0};

let edits = {}, selDir = S.selected_direction || null, notes = '', editing = null, confirming = false, result = null;
const openDirs = new Set();
(function () { const s = store.get(KEY); if (s) { edits = s.edits || {}; selDir = s.selDir || selDir; notes = s.notes || ''; } })();
const persist = () => store.set(KEY, {edits, selDir, notes});

const eff = d => Object.assign({}, d, edits[d.id] || {});
const decs = () => S.decisions.map(eff);
function counts() { const c = {CONFIRMED:0,INFERRED:0,PROPOSED:0,NEEDS_INPUT:0,REJECTED:0,SUPERSEDED:0}; decs().forEach(d => c[d.status]++); return c; }
function readiness(c) {
  const active = c.CONFIRMED + c.INFERRED + c.PROPOSED + c.NEEDS_INPUT + c.REJECTED;
  if (!active) return 0;
  return Math.round(Object.keys(W).reduce((s, k) => s + W[k] * c[k], 0) / active * 100);
}
function conflicts() {
  const m = Object.fromEntries(decs().map(d => [d.id, d])), live = x => x && !['REJECTED', 'SUPERSEDED'].includes(x.status);
  return (S.conflicts || []).filter(c => live(m[c.a]) && live(m[c.b]));
}
function blockers() {
  const c = counts(), b = [];
  if (c.NEEDS_INPUT) b.push(`${c.NEEDS_INPUT} decision${c.NEEDS_INPUT > 1 ? 's' : ''} still need your input`);
  if (c.REJECTED) b.push(`${c.REJECTED} rejected: use Request Changes so I can replace ${c.REJECTED > 1 ? 'them' : 'it'}`);
  const cf = conflicts().length; if (cf) b.push(`${cf} unresolved conflict${cf > 1 ? 's' : ''}`);
  if (!selDir) b.push('Pick a design direction');
  return b;
}
const pill = s => `<span class="pill s-${s}">${LABEL[s]}</span>`;
const dirName = id => (S.directions.find(x => x.id === id) || {}).name || '';

/* ---------- pieces ---------- */
function header(c, pct) {
  return `<div class="head"><div><div class="eyebrow">Opskeep · Project Gate</div><h1>${esc(S.project.name)}</h1>` +
    (S.project.one_liner ? `<p class="sub">${esc(S.project.one_liner)}</p>` : '') + `</div>` +
    `<div class="ready"><div class="big"><span>${pct}%</span><small>READY</small></div>` +
    `<div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>` +
    `<div class="counts">${['CONFIRMED','INFERRED','PROPOSED','NEEDS_INPUT'].map(k => `<span class="pill s-${k}">${c[k]} ${LABEL[k].toLowerCase()}</span>`).join('')}` +
    `<span class="pill ${conflicts().length ? 's-REJECTED' : 's-PROPOSED'}">${conflicts().length} conflicts</span></div></div></div>`;
}
function reopenBanner() {
  const g = S.gate || {};
  if (g.status !== 'reopened' || !(g.reopened || []).length) return '';
  return `<div class="banner"><b>Reopened.</b> ${g.reopened.length} decision${g.reopened.length > 1 ? 's' : ''} affected by a change (${esc(g.reopened.join(', '))}). Everything else stays as approved.</div>`;
}
function intentBlock() {
  return `<section class="blk"><h2>Project intent</h2><dl class="kv">${(S.intent || []).map(r => `<dt>${esc(r.label)}</dt><dd>${esc(r.value)}</dd>`).join('')}</dl></section>`;
}
function characterBlock() {
  if (!(S.character || []).length) return '';
  return `<section class="blk"><h2>Product character</h2>${S.character.map(t =>
    `<div class="trait"><span>${esc(t.trait)}</span><div class="meter" role="img" aria-label="${esc(t.trait)} ${t.score} percent"><i style="width:${t.score}%"></i></div><b>${t.score}%</b></div>`).join('')}</section>`;
}
function needBlock() {
  const ns = decs().filter(d => d.status === 'NEEDS_INPUT');
  if (!ns.length) return '';
  return `<section class="blk block-need"><h2>Blocking decisions · ${ns.length}</h2>${ns.map(d => `<div class="need"><span class="pill s-NEEDS_INPUT">Needs input</span> <span class="mono hint">${d.id}</span>` +
    `<h3>${esc(d.question || d.title)}</h3>${d.rationale ? `<p class="hint">${esc(d.rationale)}</p>` : ''}` +
    (d.reopened_because ? `<p class="hint">Reopened: ${esc(d.reopened_because)}</p>` : '') +
    (d.options && d.options.length
      ? `<div class="opts">${d.options.map(o => `<button type="button" class="opt" data-a="choose" data-id="${d.id}" data-v="${esc(o.value)}" data-l="${esc(o.label)}"><b>${esc(o.label)}</b>${o.hint ? `<small>${esc(o.hint)}</small>` : ''}</button>`).join('')}</div>`
      : `<textarea id="ed-${d.id}" placeholder="Your answer" aria-label="${esc(d.title)}"></textarea><button type="button" class="btn primary sm" data-a="save-free" data-id="${d.id}">Save answer</button>`) +
    `</div>`).join('')}</section>`;
}
function actions(d, changed) {
  const b = (a, l, cls) => `<button type="button" class="btn sm ${cls || ''}" data-a="${a}" data-id="${d.id}">${l}</button>`;
  let r = '';
  if (d.status === 'INFERRED' || d.status === 'PROPOSED') r = b('confirm', 'Confirm', 'primary') + b('edit', 'Change') + b('reject', 'Reject', 'danger');
  else if (d.status === 'CONFIRMED') r = b('edit', 'Change') + (changed ? b('reset', 'Undo') : '');
  else if (d.status === 'REJECTED') r = b('reset', 'Reconsider');
  return r ? `<div class="row">${r}</div>` : '';
}
function editor(d) {
  return `<div class="row" style="align-items:stretch;flex-direction:column;gap:8px;margin-top:8px">` +
    (d.options && d.options.length ? `<div class="opts">${d.options.map(o => `<button type="button" class="opt" data-a="choose" data-id="${d.id}" data-v="${esc(o.value)}" data-l="${esc(o.label)}"><b>${esc(o.label)}</b>${o.hint ? `<small>${esc(o.hint)}</small>` : ''}</button>`).join('')}</div>` : '') +
    `<textarea id="ed-${d.id}" aria-label="Edit ${esc(d.title)}">${esc(d.value)}</textarea>` +
    `<div class="row"><button type="button" class="btn primary sm" data-a="save-edit" data-id="${d.id}">Save change</button><button type="button" class="btn sm" data-a="cancel-edit">Cancel</button></div></div>`;
}
function decRow(d) {
  const changed = !!edits[d.id];
  return `<li class="dec ${d.status === 'SUPERSEDED' ? 'muted' : ''} ${changed ? 'changed' : ''}" id="${d.id}"><div class="dec-head"><span class="mono id">${d.id}</span><span class="dec-title">${esc(d.title)}</span>${pill(d.status)}</div>` +
    `<div class="dec-val">${esc(d.value)}</div>${d.rationale ? `<div class="dec-why">${esc(d.rationale)}</div>` : ''}` +
    (editing === d.id ? editor(d) : actions(d, changed)) + `</li>`;
}
function decisionsBlock() {
  const all = decs().filter(d => d.status !== 'NEEDS_INPUT');
  const html = AREAS.map(([k, label]) => {
    const rows = all.filter(d => d.area === k && d.status !== 'SUPERSEDED');
    return rows.length ? `<h3 class="area-h">${label}</h3><ul class="decs">${rows.map(decRow).join('')}</ul>` : '';
  }).join('');
  const sup = all.filter(d => d.status === 'SUPERSEDED');
  return `<section class="blk"><h2>Decisions</h2>${html}${sup.length ? `<h3 class="area-h">Superseded</h3><ul class="decs">${sup.map(decRow).join('')}</ul>` : ''}</section>`;
}
function conflictBlock() {
  const cf = conflicts(); if (!cf.length) return '';
  return `<section class="blk block-need"><h2>Conflicts · ${cf.length}</h2>${cf.map(c => `<p class="need"><span class="mono">${c.a} ↔ ${c.b}</span><br>${esc(c.text)}<br><span class="hint">Reject or change one of them above to resolve.</span></p>`).join('')}</section>`;
}
function dirCard(x) {
  const sel = selDir === x.id, open = openDirs.has(x.id), col = (x.tokens && x.tokens.color) || {};
  return `<article class="dir ${sel ? 'sel' : ''}"><div class="stage">${miniPreview(Object.assign({title: S.project.name}, x.preview))}</div>` +
    `<div class="dir-top"><span class="mono hint">${x.id}</span><h3>${esc(x.name)}</h3>${sel ? '<span class="pill s-CONFIRMED">Selected</span>' : ''}</div><p>${esc(x.tagline)}</p>` +
    (open ? `<div class="detail"><p>${esc(x.fit)}</p><div class="swatchrow" aria-label="Palette">${['bg','surface','primary','text'].map(k => col[k] ? `<i style="background:${esc(col[k])}" title="${k} ${esc(col[k])}"></i>` : '').join('')}</div>` +
      `<dl>${Object.entries(x.foundation).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><p><b>Trade-off:</b> ${esc(x.tradeoffs)}</p></div>` : '') +
    `<div class="row"><button type="button" class="btn ${sel ? '' : 'primary'}" data-a="select-dir" data-id="${x.id}" aria-pressed="${sel}">${sel ? 'Selected' : 'Select direction'}</button>` +
    `<button type="button" class="btn" data-a="toggle-dir" data-id="${x.id}" aria-expanded="${open}">${open ? 'Hide details' : 'Explore direction'}</button></div></article>`;
}
function directionsBlock() {
  return `<section class="blk"><h2>Design directions</h2><div class="dirs">${S.directions.map(dirCard).join('')}</div></section>`;
}
function foundationBlock() {
  const x = S.directions.find(d => d.id === selDir);
  return `<section class="blk"><h2>Foundation${x ? ' · ' + esc(x.name) : ''}</h2>` +
    (x ? `<table class="found">${Object.entries(x.foundation).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>` : '<p class="hint">Select a direction to see its foundation.</p>') + '</section>';
}
function riskBlock() {
  const rs = S.risks || [], as = S.assumptions || [];
  if (!rs.length && !as.length) return '';
  return `<section class="blk"><h2>Risks &amp; assumptions</h2>` +
    rs.map(r => `<div class="risk"><span class="pill ${r.severity === 'high' ? 's-REJECTED' : r.severity === 'low' ? 's-PROPOSED' : 's-NEEDS_INPUT'}">${esc(r.severity || 'med')}</span><span>${esc(r.text)}</span></div>`).join('') +
    as.map(a => `<div class="risk"><span class="pill s-INFERRED">assumed</span><span>${esc(a.text)}</span></div>`).join('') + '</section>';
}
function approvalRail() {
  const bl = blockers(), c = counts(), unrev = c.INFERRED + c.PROPOSED;
  return `<div class="gate ${result && result.action === 'approve_project_gate' ? 'ok' : ''}"><div class="eyebrow">Project gate</div>` +
    `<div class="state">${result && result.action === 'approve_project_gate' ? 'APPROVAL SUBMITTED' : '⚠ NOT APPROVED'}</div>` +
    `<p class="fine">${result && result.action === 'approve_project_gate' ? 'Not recorded until Claude validates and applies it.' : 'Approving authorises the design direction only, not implementation.'}</p>` +
    (bl.length ? `<ul>${bl.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : '') +
    `<label class="hint" for="notes">Notes for Claude (optional)</label><textarea id="notes" placeholder="Anything to add or change">${esc(notes)}</textarea>` +
    `<div class="btns"><button type="button" class="btn primary" data-a="ask-approve" ${bl.length ? 'disabled' : ''}>Approve Project Gate</button>` +
    `<button type="button" class="btn" data-a="submit" data-act="request_changes">Request Changes</button>` +
    `<button type="button" class="btn" data-a="submit" data-act="explore_alternative">Explore Alternative</button></div>` +
    (confirming ? `<div class="confirm"><span>Approve <b>${esc(dirName(selDir))}</b> for <b>${esc(S.project.name)}</b>?` +
      (unrev ? ` ${unrev} inferred/proposed decision${unrev > 1 ? 's' : ''} will be confirmed by approving.` : '') + ` Implementation stays locked until the security gate passes.</span>` +
      `<div class="row"><button type="button" class="btn primary sm" data-a="submit" data-act="approve_project_gate">Yes, approve</button><button type="button" class="btn sm" data-a="cancel-approve">Cancel</button></div></div>` : '') +
    (result ? resultPanel(result, {title: {approve_project_gate: 'Approval ready', request_changes: 'Change request ready', explore_alternative: 'Alternative request ready'}[result.action], lead: 'Copy this and paste it back into the chat with Claude, or download it.', filename: 'gate-response.json'}) : '') + '</div>';
}

function render() {
  const c = counts();
  $('#app').innerHTML = header(c, readiness(c)) + reopenBanner() +
    `<div class="layout"><div>${intentBlock()}${characterBlock()}${needBlock()}${conflictBlock()}${directionsBlock()}${foundationBlock()}${decisionsBlock()}${riskBlock()}</div><aside class="rail">${approvalRail()}</aside></div>`;
  if (editing) { const t = $('#ed-' + editing); if (t) t.focus(); }
}

/* ---------- actions ---------- */
function setEdit(id, patch) { edits[id] = Object.assign({}, edits[id] || {}, patch); result = null; confirming = false; persist(); }
function buildResponse(action) {
  const changes = [];
  Object.entries(edits).forEach(([id, e]) => {
    const base = S.decisions.find(d => d.id === id); if (!base) return;
    if (e.status !== base.status || (e.value != null && e.value !== base.value)) {
      const ch = {id, status: e.status, value: e.value != null ? e.value : base.value};
      if (e.choice) ch.choice = e.choice; changes.push(ch);
    }
  });
  return {schema: 'opskeep.project-gate/response@1', project: S.project.slug, base_hash: H, action, selected_direction: selDir, changes, notes: notes.trim(), submitted_at: new Date().toISOString()};
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id;
  if (a === 'copy') return copyResult();
  if (a === 'download') return downloadResult(t.dataset.f);
  if (a === 'confirm') setEdit(id, {status: 'CONFIRMED'});
  else if (a === 'reject') setEdit(id, {status: 'REJECTED'});
  else if (a === 'reset') { delete edits[id]; result = null; persist(); }
  else if (a === 'edit') editing = id;
  else if (a === 'cancel-edit') editing = null;
  else if (a === 'save-edit') { const v = $('#ed-' + id).value.trim(); if (v) setEdit(id, {status: 'CONFIRMED', value: v}); editing = null; }
  else if (a === 'save-free') { const v = $('#ed-' + id).value.trim(); if (!v) return; setEdit(id, {status: 'CONFIRMED', value: v}); }
  else if (a === 'choose') { setEdit(id, {status: 'CONFIRMED', value: t.dataset.l, choice: t.dataset.v}); editing = null; }
  else if (a === 'select-dir') { selDir = id; result = null; confirming = false; persist(); }
  else if (a === 'toggle-dir') { openDirs.has(id) ? openDirs.delete(id) : openDirs.add(id); }
  else if (a === 'ask-approve') confirming = true;
  else if (a === 'cancel-approve') confirming = false;
  else if (a === 'submit') { if (t.dataset.act === 'approve_project_gate' && blockers().length) return; confirming = false; result = buildResponse(t.dataset.act); }
  else return;
  render();
  if (result && (a === 'submit')) { const r = $('#result-json'); if (r) r.scrollIntoView({block: 'nearest', behavior: 'smooth'}); }
});
document.addEventListener('input', e => { if (e.target.id === 'notes') { notes = e.target.value; result = null; persist(); } });
render();
</script>
</body>
</html>
