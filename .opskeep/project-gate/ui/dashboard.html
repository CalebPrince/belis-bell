<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belis Bell Project Gate</title>
<style>
:root{
  --bg:#f6f6f3;--panel:#ffffff;--ink:#16181d;--muted:#565d6b;--line:#dfe1e6;--line-strong:#c7cad2;
  --accent:#2447b8;--accent-ink:#ffffff;--accent-soft:#e8edfb;
  --ok:#0f6a3b;--ok-bg:#e3f3ea;--warn:#7a4700;--warn-bg:#fcefd6;--bad:#a11d12;--bad-bg:#fbe7e4;
  --info:#28449a;--info-bg:#e8edfb;--neutral:#3f4652;--neutral-bg:#eceef1;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.05);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--panel:#171a20;--ink:#eceef2;--muted:#a3aab8;--line:#2a2f39;--line-strong:#3a4150;
  --accent:#8fb0ff;--accent-ink:#0b1020;--accent-soft:#1c2540;
  --ok:#66d19a;--ok-bg:#12301f;--warn:#f2c26b;--warn-bg:#33270d;--bad:#ff9d92;--bad-bg:#3a1714;
  --info:#a9c0ff;--info-bg:#1c2540;--neutral:#c5cad4;--neutral-bg:#232833;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);}}
:root[data-theme="dark"]{
  --bg:#0f1115;--panel:#171a20;--ink:#eceef2;--muted:#a3aab8;--line:#2a2f39;--line-strong:#3a4150;
  --accent:#8fb0ff;--accent-ink:#0b1020;--accent-soft:#1c2540;
  --ok:#66d19a;--ok-bg:#12301f;--warn:#f2c26b;--warn-bg:#33270d;--bad:#ff9d92;--bad-bg:#3a1714;
  --info:#a9c0ff;--info-bg:#1c2540;--neutral:#c5cad4;--neutral-bg:#232833;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hint,.why{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.link.on{color:var(--accent);font-weight:600}

.pill{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:999px;white-space:nowrap}
.s-CONFIRMED{background:var(--ok-bg);color:var(--ok)}
.s-INFERRED{background:var(--info-bg);color:var(--info)}
.s-PROPOSED{background:var(--neutral-bg);color:var(--neutral)}
.s-NEEDS_INPUT{background:var(--warn-bg);color:var(--warn)}
.s-REJECTED{background:var(--bad-bg);color:var(--bad)}
.s-SUPERSEDED{background:var(--neutral-bg);color:var(--muted);text-decoration:line-through}

input[type=text],textarea{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel)}
textarea{resize:vertical;min-height:72px}

.meter{height:8px;background:var(--neutral-bg);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}

.mini{display:block;width:100%;height:auto;border-radius:6px}

.result{margin-top:14px;padding:14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel)}
.result h3{font-size:15px;margin-bottom:4px}
.result textarea{font:12px/1.4 var(--mono);min-height:110px;margin:10px 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
.head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.head h1{font-size:30px;margin-top:8px}
.head .sub{color:var(--muted);margin-top:4px;max-width:64ch}
.ready{min-width:260px;flex:1;max-width:420px}
.ready .big{font:700 28px/1 var(--mono);display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.ready .big small{font:600 11px var(--mono);color:var(--muted);letter-spacing:.1em}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.banner{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.layout{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.layout{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
section.blk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
section.blk>h2{font:700 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.trait{display:grid;grid-template-columns:110px 1fr 44px;gap:12px;align-items:center;font-size:14px;margin:8px 0}
.trait b{font:600 13px var(--mono);text-align:right}
.block-need{border-color:var(--warn)}
.need{padding:14px 0;border-top:1px solid var(--line)}
.need:first-of-type{border-top:0;padding-top:0}
.need h3{font-size:16px;margin:6px 0}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-top:10px}
.opt{text-align:left;border:1.5px solid var(--line-strong);background:var(--panel);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:14px}.opt small{color:var(--muted)}
.area-h{font-size:15px;margin:18px 0 6px}
.area-h:first-of-type{margin-top:0}
ul.decs{list-style:none;margin:0;padding:0}
.dec{padding:12px 0;border-top:1px solid var(--line)}
.dec:first-child{border-top:0}
.dec.muted{opacity:.55}
.dec-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dec-head .id{font-size:12px;color:var(--muted)}
.dec-title{font-weight:650;flex:1;min-width:160px}
.dec-val{margin-top:4px}
.dec-why{margin-top:2px;color:var(--muted);font-size:13px}
.dec .row{margin-top:8px}
.dec.changed{border-left:3px solid var(--accent);padding-left:12px;margin-left:-15px}
.dirs{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.dir{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.dir.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dir-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dir-top h3{font-size:16px;flex:1}
.dir .detail{font-size:13px;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.dir .detail dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}
.dir .detail dt{color:var(--muted)}.dir .detail dd{margin:0;text-align:right}
.swatchrow{display:flex;gap:4px}.swatchrow i{width:18px;height:18px;border-radius:5px;border:1px solid var(--line)}
table.found{width:100%;border-collapse:collapse;font-size:14px}
table.found td{padding:7px 0;border-top:1px solid var(--line)}
table.found td:first-child{color:var(--muted);width:42%}
.risk{display:flex;gap:10px;font-size:14px;padding:6px 0}
.rail{position:sticky;top:12px}
@media (max-width:999px){.rail{position:static}}
.gate{border:2px solid var(--warn);border-radius:14px;padding:18px;background:var(--panel);box-shadow:var(--shadow)}
.gate.ok{border-color:var(--ok)}
.gate .state{font:700 15px var(--mono);color:var(--warn);margin:8px 0 4px}
.gate .fine{font-size:13px;color:var(--muted);margin-bottom:12px}
.gate ul{margin:0 0 12px;padding-left:18px;font-size:13px;color:var(--warn)}
.gate .btns{display:grid;gap:8px}
.gate .btns .btn{padding:10px 14px}
.gate textarea{margin:10px 0;min-height:64px}
.confirm{border:1px solid var(--line-strong);background:var(--neutral-bg);border-radius:10px;padding:12px;font-size:13px;margin-top:10px;display:grid;gap:10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>const DATA={"state": {"schema": "opskeep.project-gate/state@1", "project": {"name": "Belis Bell", "slug": "belis-bell", "one_liner": "Online store for washroom and cleaning products in Ghana, serving households and businesses plus institutional buyers such as banks, schools, and government and private companies.", "created": "2026-09-26"}, "intent": [{"label": "Product", "value": "Online store with a business-supply (B2B) side"}, {"label": "Primary users", "value": "Institutional buyers (banks, schools, government, private companies) and general shoppers"}, {"label": "Usage", "value": "Heavy contact: ordering, quotes and conversations all day"}, {"label": "Primary job", "value": "Find the right product, get a price or quote, and order with confidence"}, {"label": "Platform", "value": "Responsive web store, full features on phone and desktop"}, {"label": "Reference", "value": "Owner-supplied home page mockup (structure only); the owner supplies all images"}], "character": [{"trait": "Trustworthy", "score": 95}, {"trait": "Photo-led", "score": 75}, {"trait": "Friendly", "score": 70}, {"trait": "Premium", "score": 60}, {"trait": "Operational", "score": 65}], "decisions": [{"id": "PG-001", "area": "project", "title": "Online store for two audiences", "status": "CONFIRMED", "confirmed_via": "interview", "value": "One store serves everyday buyers and institutional accounts. Same catalogue, different paths: quick checkout for individuals, quotes and account ordering for institutions.", "rationale": "Belis Bell sells washroom and cleaning products and also supplies banks, schools, and government and private companies."}, {"id": "PG-002", "area": "responsive", "title": "Responsive web, full parity on phone", "status": "CONFIRMED", "confirmed_via": "interview", "value": "One responsive web app. Phone gets everything the desktop gets: browsing, quotes, checkout, account, order history. No native app in v1.", "rationale": "Used on desktop and phone, and you asked for everything on mobile."}, {"id": "PG-003", "area": "responsive", "title": "Slow-network tolerance", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Lean pages, responsive compressed images, skeleton loading, retryable requests, cart and quote drafts that survive a dropped connection.", "rationale": "You flagged slow or patchy internet."}, {"id": "PG-004", "area": "users", "title": "Use in the field, on the move and on shared screens", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Large touch targets, strong contrast and larger base type (17px body). Works at a desk, on a phone in a store room, and projected in an office.", "rationale": "Contexts chosen: desk, on the move, in the field, shared screen, low bandwidth.", "depends_on": ["PG-002"]}, {"id": "PG-005", "area": "users", "title": "Mixed software comfort", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Plain language, one clear action per screen, no jargon. Repeat buyers get shortcuts such as reorder and saved lists.", "rationale": "Comfort level: mixed."}, {"id": "PG-006", "area": "ux", "title": "Conversation-led buying", "status": "CONFIRMED", "value": "Talking to a person is part of the flow: WhatsApp click-to-chat and call buttons on product and quote pages, and a quote thread that carries messages, not just a form.", "rationale": "Main activity chosen was communicating, with all-day use. Local B2B buying in Ghana often runs through WhatsApp and phone.", "confirmed_via": "explicit"}, {"id": "PG-007", "area": "ux", "title": "High-stakes ordering", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Orders and quotes have a review step, a clear confirmation, an order reference, and an audit trail. Cancelling or editing after submit is deliberate and logged. Undo is not the main safety net.", "rationale": "Mistakes cost money."}, {"id": "PG-008", "area": "visual", "title": "Trustworthy, friendly, premium tone", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Calm, reliable and polished, with warm plain-language copy. Premium through restraint and photography, not gold or heavy effects. No em dashes in UI copy.", "rationale": "Feel words chosen: trustworthy, friendly, premium."}, {"id": "PG-009", "area": "visual", "title": "Editorial visual direction", "status": "SUPERSEDED", "value": "Serif display type for headings, paper-toned neutrals, generous whitespace, product photography treated like magazine pages.", "rationale": "Editorial was the closest gut pick. Superseded: you selected Fresh and Bright and asked for the Supply Master look instead (PG-025)."}, {"id": "PG-010", "area": "visual", "title": "Teal accent", "status": "SUPERSEDED", "value": "Teal is the single accent for primary buttons, links and focus. Status colours stay separate. Every teal used for text or buttons meets 4.5:1.", "rationale": "Teal picked; suits water, cleanliness and hygiene. Superseded: the supplied logo sets the brand colours (PG-029)."}, {"id": "PG-011", "area": "visual", "title": "Soft elevated surfaces", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Product cards, quote panels and summary boxes sit on soft shadows. Elevation is reserved for things you act on; page sections stay flat.", "rationale": "Soft elevation picked."}, {"id": "PG-012", "area": "visual", "title": "Light and dark themes", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Follows the device. Light is the designed default (paper-toned); dark is a full second palette, not an inversion.", "rationale": "Both themes chosen."}, {"id": "PG-013", "area": "ux", "title": "Top bar with mega-menu navigation", "status": "SUPERSEDED", "value": "Sticky top bar: logo, search, account, cart, and a Buy for Business link. A category mega-menu on desktop; a full-screen category drawer on phone. No sidebar.", "rationale": "Top bar chosen; the reference site uses a category mega-menu for a large catalogue. Superseded: the owner mockup sets the header and navigation (PG-034).", "depends_on": ["PG-002"]}, {"id": "PG-014", "area": "screens", "title": "Content mix: photos, product grids and copy", "status": "SUPERSEDED", "value": "Home follows a fixed section order: announcement bar, header, nav row, split hero (photo with headline beside a 2x2 cluster of coloured feature tiles), category pill tabs, product carousels, brand spotlight, three ways to shop tiles, core category tiles, featured partner picks, trust counter, brand in focus, all brands A to Z, footer. Buying guides and hygiene advice sit as a lower strip. Copy and images are Belis Bell's own.", "rationale": "Section arrangement taken from the reference at your request; content is original. Superseded: the owner mockup sets the home page structure (PG-033).", "depends_on": ["PG-025"]}, {"id": "PG-015", "area": "accessibility", "title": "WCAG 2.2 AA plus extended needs", "status": "CONFIRMED", "confirmed_via": "interview", "value": "AA baseline with full keyboard operation, screen-reader labelling and live regions for cart and quote changes, a low-vision mode (text scaling to 200% without breakage, no reliance on colour), and layouts that tolerate text expansion and RTL.", "rationale": "Keyboard, screen reader, low vision and multi-language needs all selected."}, {"id": "PG-016", "area": "project", "title": "Brand identity starts fresh", "status": "SUPERSEDED", "value": "No existing brand guide. Belis Bell gets a wordmark, colour system and photography style as part of this build, all defined in the approved direction.", "rationale": "Brand answer: starting fresh. Superseded: a logo was supplied (PG-030)."}, {"id": "PG-017", "area": "ux", "title": "supplymaster.store as structural reference", "status": "SUPERSEDED", "value": "Borrow the structure that works for supply retail: category mega-menu, Buy for Business quote path, delivery and pay-on-delivery messaging, trust counters, FAQ. Do not copy its visual identity, layout details or copy.", "rationale": "Given as a note in the workshop. Superseded: you asked to copy the visual style and section arrangement, not just structure (PG-026)."}, {"id": "PG-018", "area": "screens", "title": "Buy for Business path", "status": "CONFIRMED", "value": "A dedicated path for institutions: request a quote from a cart or a list, upload a requirements sheet, get a quote thread, then approve it into an order. Repeat orders reuse past quotes.", "rationale": "Institutional supply is half the business and quote-led buying is how institutions procure.", "depends_on": ["PG-001", "PG-006"], "confirmed_via": "explicit"}, {"id": "PG-019", "area": "screens", "title": "Core screen set", "status": "CONFIRMED", "value": "Home, category, product, search results, cart, checkout, quote request, quote thread, account (orders, saved lists, addresses), order tracking, buying guides, about and contact, FAQ.", "rationale": "Standard store plus the B2B path.", "depends_on": ["PG-001"], "confirmed_via": "explicit"}, {"id": "PG-020", "area": "screens", "title": "Product page built for trust", "status": "SUPERSEDED", "value": "Large photo with zoom, pack size and unit price, stock status, safety and usage notes, downloadable spec or safety data sheet where relevant, WhatsApp button, and add-to-cart plus add-to-quote.", "rationale": "Institutional buyers compare pack sizes and need documentation. Superseded: the owner mockup sets the product page (PG-039).", "depends_on": ["PG-018"]}, {"id": "PG-021", "area": "visual", "title": "Empty, loading and error states", "status": "CONFIRMED", "value": "Skeleton loaders, helpful empty states (empty cart suggests categories), and plain errors that say what happened and how to fix it, with a retry.", "rationale": "Patchy connections make this visible often.", "depends_on": ["PG-003"], "confirmed_via": "explicit"}, {"id": "PG-022", "area": "project", "title": "Payment model", "status": "CONFIRMED", "rationale": "Changes checkout, account screens and the security design. Decide before build.", "question": "How will customers pay?", "options": [{"value": "online", "label": "Pay online", "hint": "Mobile money and card at checkout"}, {"value": "mixed", "label": "Online plus pay on delivery or invoice", "hint": "Individuals pay online, institutions get invoiced"}, {"value": "orders_only", "label": "Orders and quotes only", "hint": "No online payment; you confirm and invoice by hand"}], "value": "Pay online", "choice": "online", "confirmed_via": "explicit"}, {"id": "PG-023", "area": "project", "title": "Institutional account model", "status": "CONFIRMED", "rationale": "Decides whether institutions log in with contract pricing or just request quotes.", "question": "How should institutions buy?", "options": [{"value": "quotes", "label": "Request a quote each time", "hint": "No special accounts; you reply with pricing"}, {"value": "accounts", "label": "Approved business accounts", "hint": "Login, agreed pricing, order history, approval by you"}, {"value": "both", "label": "Quotes first, accounts later", "hint": "Launch with quotes, add accounts in a later phase"}], "value": "Request a quote each time", "choice": "quotes", "confirmed_via": "explicit"}, {"id": "PG-024", "area": "screens", "title": "Public prices", "status": "CONFIRMED", "rationale": "Affects catalogue cards, search and SEO.", "question": "Should prices be visible to everyone?", "options": [{"value": "public", "label": "Prices shown to all", "hint": "Standard store behaviour"}, {"value": "mixed", "label": "Retail prices public, bulk on quote", "hint": "Shows price, adds request-bulk-price"}, {"value": "hidden", "label": "Prices on request", "hint": "Catalogue only, quote for everything"}], "value": "Prices shown to all", "choice": "public", "confirmed_via": "explicit"}, {"id": "PG-025", "area": "visual", "title": "Supply Master visual language", "status": "SUPERSEDED", "value": "Adopt the reference's visual style: deep-toned header, footer and buttons on a light page, a photo-led hero with dark overlay and large white headline, coloured feature tiles with photos, rounded (12px) buttons and cards, product carousels with a full-width add-to-cart button, Figtree-style semibold headings, generous section titles centred over light grey-tinted bands. Belis Bell's own palette, logo, photography and copy are used throughout.", "rationale": "Your note: copy the visual style, not the content. Superseded: the owner mockup replaces the Supply Master visual language (PG-036)."}, {"id": "PG-026", "area": "ux", "title": "Section arrangement follows the reference", "status": "SUPERSEDED", "value": "Home and category pages keep the reference's section order and rhythm (see PG-014). No text, product photos, logos, brand names or partner names are copied. Nothing implies affiliation with Supply Master.", "rationale": "Your note, plus the reference belongs to another company. Superseded: the owner mockup replaces the reference arrangement (PG-033).", "depends_on": ["PG-025"]}, {"id": "PG-027", "area": "visual", "title": "Deep teal takes the place of the reference's navy", "status": "SUPERSEDED", "value": "Header accent, buttons, announcement bar and footer use deep teal (#0a5f61). Feature tiles rotate teal, coral (#b4491f), green (#1f6b3d) and ink (#12303a), each with white text above 4.5:1. Reject this if you want the reference's navy instead.", "rationale": "You picked teal earlier and chose Fresh and Bright; keeping the hue keeps Belis Bell distinct from the reference. Superseded: the palette now comes from the logo (PG-031).", "depends_on": ["PG-025", "PG-010"]}, {"id": "PG-028", "area": "screens", "title": "Ways-to-shop tiles and category set", "status": "SUPERSEDED", "value": "Three big entry tiles under the product carousels: Shop Products, Buy for Business (quotes) and Washroom Solutions (curated packs for a whole washroom). Core category tiles: Washroom Supplies, Cleaning Chemicals, Cleaning Equipment, Hygiene and Waste, Dispensers and Fittings. Final names come from the real catalogue.", "rationale": "Mirrors the reference's three-ways and core-categories blocks for a washroom and cleaning catalogue. Superseded: the mockup uses six category cards and audience cards (PG-033).", "depends_on": ["PG-026", "PG-018"]}, {"id": "PG-029", "area": "visual", "title": "Brand colours come from the logo", "status": "SUPERSEDED", "value": "Blue is the single action colour (#006cbc, white text 5.4:1). Deep navy (#044788) is for the announcement bar, footer and headings on tinted bands. Green (#43b14a in the logo) is a brand accent for badges, highlights and illustration only. Text and buttons use a darker green (#2b7d32, white text 5.1:1) because the logo green fails contrast. Teal is dropped.", "rationale": "Colours sampled from the supplied logo; the earlier teal pick predates it. Superseded: the mockup uses green for primary buttons (PG-036)."}, {"id": "PG-030", "area": "project", "title": "Logo supplied", "status": "CONFIRMED", "value": "Use the updated Belis Bell logo (blue B with cart, spray bottle, soap and tissue; blue and green wordmark; descriptor 'Cleaning Supplies & More'; line 'For homes, businesses and institutions'). Saved as brand/logo-primary.webp; the first version is archived. The header uses a compact lockup and the full logo appears in the footer and about strip. The file is a 1254px raster on white with a light halo, so a transparent PNG or SVG and a horizontal lockup are needed before build.", "rationale": "You shared an updated logo in chat. Its descriptor now covers cleaning as well as washroom products.", "confirmed_via": "interview"}, {"id": "PG-031", "area": "visual", "title": "Blue, navy and green in the Bright Supply layout", "status": "SUPERSEDED", "value": "Header, buttons and links use blue. The announcement bar and footer use navy. Feature tiles rotate blue, navy, green (#2b7d32) and ink (#0a1d33), each with white text above 4.5:1. Dark theme uses a light blue primary (#6ab7f5) on a deep navy-black ground.", "rationale": "Applies the logo palette to the approved section layout. Superseded: the palette is now defined in PG-036.", "depends_on": ["PG-025", "PG-029"]}, {"id": "PG-032", "area": "project", "title": "Mock data for the first build", "status": "CONFIRMED", "confirmed_via": "interview", "value": "The first build uses clearly labelled mock data for products, prices (GHS), stock, categories, brands, delivery figures, the trust counter and customer content. Mock data lives in one seed file, is never presented as real, and is removed before launch. Payments run in provider test mode only until the security gate signs off live keys.", "rationale": "You asked to use mock data for prices, products and everything else for now.", "depends_on": ["PG-024"]}, {"id": "PG-033", "area": "screens", "title": "Home page structure follows the owner's mockup", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Sections in this order: (1) header; (2) hero with a small eyebrow label, a three-line two-tone headline, one supporting sentence, two buttons (Shop Now, For Businesses) and a row of four trust points (Fast delivery across Ghana, Quality products, Trusted support, Secure payments); (3) Explore Our Range: six category cards, each with a photo, name and an arrow; (4) a blue promo banner with headline, one sentence, a Shop Now button and a photo on the right; (5) Solutions for Every Space: three audience cards (Homes, Businesses, Institutions) with a photo, icon, title and one line; (6) Popular Products: a carousel of product cards with price and Add to Cart; (7) Why Choose Belis Bell: four points with icons (Quality Brands, Fast Delivery, Great Value, Dedicated Support); (8) a second banner, Clean Spaces Start Here, with Shop Now and Contact Us; (9) footer.", "rationale": "Supplied by the owner as a home page mockup. The mockup gives structure only; the owner supplies all images."}, {"id": "PG-034", "area": "ux", "title": "Header, navigation and footer follow the mockup", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Header: logo on the left, six text links (Home, Shop, Categories, For Businesses, About, Contact) and three icon buttons (Search, Account, Cart with a count). On phones the links move into a menu. Footer: logo and tagline with social icons, then Quick Links, Customer Support and Contact columns, then a copyright line with Privacy Policy and Terms links.", "rationale": "Shown in the owner's mockup.", "depends_on": ["PG-002"]}, {"id": "PG-035", "area": "visual", "title": "The owner supplies all imagery", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Photos and illustrations are supplied by the owner. The site is built with named image slots (listed in docs/IMAGES.md) and neutral placeholders until each image arrives. No images are generated by the developer, and none are taken from other websites. Photos that show other companies' branded packaging need the owner's confirmation that showing them is allowed.", "rationale": "Owner: 'I will supply the visuals images I want'. The mockup shows recognisable third-party brand packs, which need rights confirmed."}, {"id": "PG-036", "area": "visual", "title": "Visual style follows the mockup, with an accessible green", "status": "CONFIRMED", "value": "Light page with white and very pale blue-grey surfaces; rounded cards (16px) with a soft shadow; pill-shaped buttons, filled green for the main action and white with a navy outline for the second; headlines in navy with blue and green emphasis words; small spaced-out capital eyebrow labels; deep navy banners (#00346e and #002b61) with the photo on the right; deep navy footer (#001b38). The main button green is #2b7d32 with white text (5.1:1), because the mockup's bright green #3fa80c fails contrast with white text (3.1:1). Blue #006cbc is for links and small accents. The logo's bright green is for icons and highlights only. Dark theme stays.", "rationale": "Colours sampled from the mockup, adjusted for WCAG AA.", "depends_on": ["PG-033"], "confirmed_via": "explicit"}, {"id": "PG-037", "area": "screens", "title": "Structure pages for the navigation", "status": "CONFIRMED", "value": "Build the pages the navigation points to as structure with clearly labelled mock text: Categories (all categories), For Businesses (how quotes work, audience cards, a Request a quote button that is switched off until the quote flow is built), About, and Contact (details plus a WhatsApp link; no form yet). Footer links to FAQ, Shipping and Delivery, Returns and Refunds, Payment Methods, Track Order, Privacy Policy and Terms appear only when the page has real content. Social icons appear only with real links. The address, phone, email and opening hours in the mockup are treated as mock until supplied.", "rationale": "Every nav link should go to a real page, and policy and legal text needs real content from the owner.", "depends_on": ["PG-033", "PG-034"], "confirmed_via": "explicit"}, {"id": "PG-038", "area": "ux", "title": "Promises in the trust row are the owner's to confirm", "status": "CONFIRMED", "value": "The trust row and the Why Choose section make promises: fast delivery across Ghana, quality brands, great value, dedicated support and secure payments. Shown as mock copy until the owner confirms each is true. Secure payments is shown only once Paystack live payments are approved.", "rationale": "Claims must be things Belis Bell can keep.", "depends_on": ["PG-033"], "confirmed_via": "explicit"}, {"id": "PG-039", "area": "screens", "title": "Product page follows the owner's mockup", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Breadcrumb (Home, Shop, category, product). Left: a photo gallery with a vertical strip of thumbnails beside one large photo that has an expand button. Right: category label, product name, short description, price, Size options with a price each, quantity stepper, a large green Add to Cart button, a save-for-later heart, and the trust row. Below that, a highlights box with three benefits. Then tabs (Description, Specifications, How to Use, Delivery & Returns) with a Key Features list, a You May Also Like panel with a View All link, and a Common Uses strip of five photo tiles. The WhatsApp link, add-to-quote and downloadable data sheet (where one exists) from the earlier product page decision stay.", "rationale": "Supplied by the owner as a product page mockup. Structure only; the owner supplies all photos.", "depends_on": ["PG-035"]}, {"id": "PG-040", "area": "ux", "title": "Products can have several sizes", "status": "CONFIRMED", "value": "A product can offer several sizes (for example 1 litre, 5 litres, 20 litres), each with its own price and stock status. Choosing a size updates the price shown. The server sets every price and total; the page never decides them (CTL-BIZ-001). Sizes are shown but Add to Cart stays switched off until the cart is built.", "rationale": "The mockup shows three sizes with a price each.", "depends_on": ["PG-039"], "confirmed_via": "gate_approval"}, {"id": "PG-041", "area": "ux", "title": "Ratings, review counts and sold counts are not shown yet", "status": "CONFIRMED", "value": "The mockup shows a star rating, a review count and a '500+ sold' figure. These are not shown until a real reviews system exists, because they would otherwise be made up. A reviews system needs its own security review (moderation, abuse, fake reviews) and would change the security baseline. Benefit claims such as 'Kills 99.9% of germs' come from the supplier's data sheet and show as mock text until the owner confirms them (PG-038).", "rationale": "Claims and social proof must be true and traceable.", "depends_on": ["PG-039", "PG-038"], "confirmed_via": "gate_approval"}, {"id": "PG-042", "area": "screens", "title": "How bulk purchases work", "status": "CONFIRMED", "rationale": "Decides whether the product page shows quantity price tiers, a quote request, or both. Tier prices are business numbers only Belis Bell can set.", "depends_on": ["PG-039", "PG-018"], "confirmed_via": "interview", "choice": "both", "value": "Both. The product page has a bulk panel with quantity price tiers where Belis Bell sets them (mock tiers until supplied), an estimated total for a chosen quantity, and always a Request bulk quote button (the quote flow is not built yet, so the button is switched off). The server sets every price and total (CTL-BIZ-001)."}, {"id": "PG-043", "area": "screens", "title": "Extra product content and Common Uses photos", "status": "CONFIRMED", "value": "Each product can carry a full description, specifications, how to use, key features, three highlights and a list of common uses. Delivery and Returns text is the same for every product and comes from the owner. Common Uses tiles use owner photos named by use (laundry, bathrooms, kitchens, floors, bins), shared across products. All of this is mock text until supplied. The download of a data sheet appears only when a file exists.", "rationale": "The mockup shows these tabs and tiles.", "depends_on": ["PG-039", "PG-035"], "confirmed_via": "gate_approval"}, {"id": "PG-044", "area": "ux", "title": "Header shows a search field on wide screens", "status": "CONFIRMED", "value": "On wide screens the header shows a search field between the links and the account and cart icons, as in the product mockup. On small screens it stays an icon. Search itself is not built yet, so the field is switched off.", "rationale": "The product mockup header differs slightly from the home mockup.", "depends_on": ["PG-034"], "confirmed_via": "gate_approval"}, {"id": "PG-045", "area": "screens", "title": "Shop page structure follows the owner's mockup", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Header, then a hero banner (eyebrow 'Cleaning Supplies & More', title 'Shop Our Products', one sentence, a trust row, and a photo that fades in from the left). Below it a two-column layout. Left: a filter panel with Categories (each with a product count), Price Range (min and max in GHS with an Apply button), Availability (In Stock, Out of Stock, with counts), Brand (with counts) and Clear Filters. Right: a bar with 'Showing 1 to 12 of N products' and a Sort by menu, a product grid four across on desktop (12 per page), and numbered pagination with previous and next. Last, a trust strip of five points (Fast Delivery, Quality Products, Trusted Support, Secure Payments, Great Value). On phones the filter panel opens from a Filters button above the grid and the grid is two across.", "rationale": "Supplied by the owner as a shop page mockup. Structure only; the owner supplies all photos.", "depends_on": ["PG-035"]}, {"id": "PG-046", "area": "ux", "title": "Shop filters work on the server and keep their state in the address", "status": "PROPOSED", "value": "Category, price range, availability, brand and sort combine. Every choice is checked on the server, so odd values fall back to safe defaults. The address keeps the filters, so a filtered page can be shared or bookmarked and works without JavaScript. Counts beside each option come from the catalogue. Clear Filters resets everything. Page size is 12.", "rationale": "Filters in the mockup need real, checkable behaviour.", "depends_on": ["PG-045"]}, {"id": "PG-047", "area": "ux", "title": "No star ratings or rating filter; brand filter only with brand data", "status": "PROPOSED", "value": "The mockup shows star ratings, review counts and a rating filter. These stay out until a real reviews system exists (PG-041). The Brand filter appears only when products carry a brand. The catalogue gets an optional brand field; the mock catalogue uses invented brand names from the mockup. Real brands come from the owner, and photos of other companies' brands need permission (PG-035).", "rationale": "No made-up social proof; no filters without data.", "depends_on": ["PG-045", "PG-041"]}, {"id": "PG-048", "area": "ux", "title": "Shop card extras", "status": "PROPOSED", "value": "Cards show photo, name, size, price and a stock badge with an icon. The heart (save for later) and Add to Cart are shown but switched off until the cart and saved lists are built. The small quantity stepper in the mockup is left off cards until the cart exists; the product page has one.", "rationale": "Avoid controls on cards that cannot do anything yet.", "depends_on": ["PG-045"]}, {"id": "PG-049", "area": "screens", "title": "Shop trust rows are the owner's promises", "status": "PROPOSED", "value": "The hero trust row and the bottom strip (including 'Great Value: Competitive prices') are promises. They show as mock copy until the owner confirms each one, and Secure Payments appears only once live payments are approved (PG-038).", "rationale": "Claims must be things Belis Bell can keep.", "depends_on": ["PG-045", "PG-038"]}, {"id": "PG-050", "area": "screens", "title": "Category page structure follows the owner's mockup", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Breadcrumb (Home, Shop, category); a category hero with the category name, a description, four trust points and a photo that fades in from the left; a left panel headed with the category name that lists 'All <category>' plus its subcategories with counts, then Price Range, Availability and Brand; a bar with 'Showing 1 to 12 of N products' and Sort by; the product grid (two across on phones, three on tablets, four on desktop, six on very wide screens; 12 per page); and a closing strip 'Why Choose Our <category>' with four points.", "rationale": "Supplied by the owner as a category page mockup.", "depends_on": ["PG-045"]}, {"id": "PG-051", "area": "ux", "title": "Categories can have subcategories", "status": "PROPOSED", "value": "A category can have subcategories, one level deep, each with its own product count. The category page lists them in the filter panel and filters by the chosen one. The mock catalogue uses the subcategory names from the mockup for Cleaning Products only. Real subcategories come from the owner.", "rationale": "The category mockup shows subcategories inside the filter panel.", "depends_on": ["PG-050"]}, {"id": "PG-052", "area": "screens", "title": "Cart page structure follows the owner's mockup", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Breadcrumb (Home, Shop, Cart); title 'Your Shopping Cart' with a Continue Shopping link; an items table (remove icon, photo, name, size, stock, unit price, quantity stepper, line total); an Order Summary card (subtotal with item count, delivery fee with an info tip, total) with ONE green 'Proceed to Checkout' button. The 'Pay with Mobile Money' button from the mockup is not built. Below the summary: a Delivery Information box and a Secure Payments box with a row of payment channel logos. Then a trust row and a 'You May Also Like' panel of four products with a View All Products link.", "rationale": "Supplied by the owner. The owner asked to leave out the Pay with Mobile Money button.", "depends_on": ["PG-035"]}, {"id": "PG-053", "area": "screens", "title": "Checkout page: sign-in required, pay through Paystack", "status": "CONFIRMED", "confirmed_via": "interview", "value": "No guest checkout: a customer must be signed in, and 'Proceed to Checkout' sends anyone who is not to sign in and then back. The page has a progress bar (Shopping Cart, Checkout, Payment, Confirmation) and three sections: Contact Information (name, phone with country code, email), Delivery Address (Home, Business or Institution; region; city or town; area; address details; optional notes) and Delivery Option (Standard or Express). The Payment Method section from the mockup is not built. The sidebar has the order summary with an Edit Cart link, a trust box and a WhatsApp help box. The final green button reads 'Pay with Paystack': it creates the order and sends the customer to Paystack's own payment page, where they choose mobile money or card. No payment details are ever entered on our pages (CTL-PAY-001).", "rationale": "Supplied by the owner, who ruled out guest checkout and the payment method section.", "depends_on": ["PG-022", "PG-052"]}, {"id": "PG-054", "area": "ux", "title": "Delivery rules are mock until supplied", "status": "PROPOSED", "value": "The regions and towns lists, Standard delivery at GHS 20.00 (1 to 3 working days in Accra, 2 to 5 elsewhere) and Express at GHS 40.00 (same day in Accra, order before 12pm) are mock until Belis Bell supplies real rules. The server sets the delivery fee from the address and option (CTL-BIZ-001). The 'agree to Terms and Privacy Policy' line appears only once those pages exist with real text (DEC-005).", "rationale": "Delivery fees and legal text are the owner's to set.", "depends_on": ["PG-053"]}, {"id": "PG-055", "area": "screens", "title": "Order confirmation page structure follows the owner's mockup", "status": "CONFIRMED", "confirmed_via": "interview", "value": "A thank-you header with the customer's name and where updates will be sent; four detail tiles (order number, date, payment method, delivery method); an Order Tracking panel with five steps; four action buttons (View Order Details, Download Invoice, Track Order, Continue Shopping); an Order Summary with the order number and 'Total Paid'; a payment box; and a row of four cards (Delivery Information, Need Help, Business Customer with a Request a Quote button, Continue Shopping). The page also has states for payment pending, failed and cancelled. 'Total Paid' and 'Payment Successful' appear only after the payment is confirmed with Paystack, and the payment method shown is what Paystack reports. Only the customer who owns the order can see it.", "rationale": "Supplied by the owner.", "depends_on": ["PG-053"]}, {"id": "PG-056", "area": "ux", "title": "Order updates and tracking", "status": "PROPOSED", "value": "Updates go by email. The 'Get Updates on WhatsApp' button opens a click-to-chat with the order number (DEC-008); automatic WhatsApp messages need the WhatsApp Business API and would be a separate security change. The five tracking steps are moved by staff in the admin (not built yet); until then the page shows only the steps the system knows (Order Received, Payment Confirmed). 'Download Invoice' is left out until Belis Bell supplies its business and tax details.", "rationale": "Keeps to the approved WhatsApp decision and avoids invented tax information.", "depends_on": ["PG-055"]}, {"id": "PG-057", "area": "screens", "title": "Account dashboard structure follows the owner's mockup", "status": "CONFIRMED", "confirmed_via": "interview", "value": "A left sidebar with the customer's name and email, then Dashboard, My Orders, My Addresses, Saved Products, Reorder, Quotes & Bulk Orders, Invoices, Account Details, Payment Methods, Notifications and Log Out. The dashboard shows a Request a Quote banner; four tiles (Total Orders, Total Spent, Saved Products, Repeat Orders); Recent Orders with a status pill and View Details; Saved Products with Add to Cart; My Addresses with a default marker and Manage Addresses; Quick Actions; and Account Details (name, email, phone, account type, member since).", "rationale": "Supplied by the owner.", "depends_on": ["PG-053"]}, {"id": "PG-058", "area": "ux", "title": "Account scope for the first version", "status": "PROPOSED", "value": "Payment Methods is not built: payment details stay with Paystack (CTL-PAY-001), and customers choose how to pay on Paystack's page each time. Recurring orders are left for later; version one has one-click Reorder. Account type is Individual or Business, chosen at sign-up (PG-067); institutions still request a quote each time, and staff link an organisation only when repeat buyers need shared access (PG-023). Invoices and Notifications pages appear once there is real content (tax details, email preferences). Total Spent counts only orders whose payment was confirmed.", "rationale": "Keeps the account within the approved security design.", "depends_on": ["PG-057"]}, {"id": "PG-059", "area": "visual", "title": "Payment channel logos are official marks supplied by the owner", "status": "PROPOSED", "value": "The row of payment logos (MTN MoMo, Telecel Cash, AirtelTigo Money or AT Money, Visa, Mastercard) uses the official marks, supplied by the owner or from the brands' official brand pages with the owner's agreement, saved as `payments/<name>` slots. Only channels enabled on the Belis Bell Paystack account are shown, using the names the Paystack account shows. Nothing is drawn or recreated. Vodafone Cash is not shown (now Telecel Cash).", "rationale": "Brand marks carry usage rules and must match the real account.", "depends_on": ["PG-052", "PG-035"]}, {"id": "PG-060", "area": "screens", "title": "Admin dashboard structure follows the owner's mockup", "status": "CONFIRMED", "confirmed_via": "interview", "value": "A dark navy left sidebar (Dashboard, Orders with a count badge, Products with All Products, Categories, Inventory and Product Reviews, Customers, Quotes & Bulk Orders with a badge, Promotions, Content, Reports, Delivery & Logistics, Payments, Users & Roles, Settings) with an Online Store link at the bottom. A top bar with a search field for orders, products and customers, a notifications bell, and the signed-in person's name and role. The page has a title, a welcome line and a date range picker; five stat tiles (Total Orders, Total Revenue, Customers, Products, Low Stock Items) each with a change against the previous month; a Sales Overview line chart (revenue and orders); an Order Status donut with Pending, Processing, Dispatched, Delivered and Cancelled counts; Quick Actions (Add New Product, Create Promotion, View Orders, Generate Report, Manage Delivery Areas, Store Settings); a Recent Orders table; and a Low Stock Products table.", "rationale": "Supplied by the owner as an admin dashboard mockup.", "depends_on": ["PG-035"]}, {"id": "PG-061", "area": "ux", "title": "Admin first-version scope and roles", "status": "PROPOSED", "value": "Build order: Orders, Products and Inventory, Quotes & Bulk Orders, Customers, Users & Roles, then Delivery & Logistics (checkout needs delivery areas). Payments is a read-only view of Paystack transactions. Promotions, Content and Reports come later, and Product Reviews is left out because there is no reviews system (PG-041). Menus and pages depend on the role (owner, sales, fulfilment, content, DEC-007). Total Revenue, the sales chart, Users & Roles and Settings are owner-only. Exports are limited, logged and approved by the owner. Figures count only orders whose payment was confirmed. The profile shows the person's own role.", "rationale": "Keeps the admin inside the approved security design and the real build order.", "depends_on": ["PG-060"]}, {"id": "PG-062", "area": "screens", "title": "Admin login page structure follows the owner's mockup", "status": "CONFIRMED", "confirmed_via": "interview", "value": "A split screen. Left: a navy panel with the logo, an 'Admin Portal' label, a headline, a short list of what the admin does, and a secure-access note over a photo. Right: a Back to Website link, the logo, 'Admin Login', an email field, a password field with a show and hide control, a green Sign In button, and an 'Authorized Access Only' notice.", "rationale": "Supplied by the owner as an admin login mockup.", "depends_on": ["PG-035"]}, {"id": "PG-063", "area": "ux", "title": "Admin sign-in rules", "status": "PROPOSED", "value": "No Remember me and no Continue with Google on the admin login, because staff sessions are short by design and a third-party sign-in would change the security design. Forgot password is owner-only: staff ask the owner to reset their access. After the password, staff enter an emailed code as customers do (PG-069). The page is not linked from the storefront. The left panel lists only what is built, and the secure-access note states something specific and true, such as that every sign-in is confirmed with an emailed code and sessions expire quickly.", "rationale": "Matches the approved security baseline (CTL-AUTH-002, CTL-SESS-001).", "depends_on": ["PG-062"]}, {"id": "PG-064", "area": "screens", "title": "Customer login: email and password, then an emailed code", "status": "CONFIRMED", "confirmed_via": "interview", "value": "A split screen like the admin login. Right side: a 'Customer Login' label, 'Welcome back!', an email field, a password field with a show and hide control, Forgot password, a green Sign In button, and a 'Create an Account' card. After the email and password, the customer receives a 6-digit verification code by email and enters it to finish signing in. A code lasts 10 minutes, works once, allows 5 wrong tries, and a new one can be requested after a short wait. Only a scrambled form of each code is stored. Wrong email, password or code all give the same kind of message.", "rationale": "Supplied by the owner, who asked for email verification codes on login.", "depends_on": ["PG-053"]}, {"id": "PG-065", "area": "ux", "title": "Customer sign-in details", "status": "PROPOSED", "value": "A code is required at every sign-in, and 'Remember me' is not shown; a 'trust this device for 30 days' option can replace it if the owner wants fewer codes. Continue with Google and Continue with Apple are left out for now, since they add outside companies as ways in and email codes already cover the need. Email delivery must work (SPF, DKIM and DMARC, CTL-ACCT-001), with a resend button and a Chat on WhatsApp link for people who do not get the code. The panel text is specific and true (for example 'Sign-ins are confirmed with an email code'), and the Exclusive Offers line is left out because promotions are not in the first version.", "rationale": "Keeps the sign-in within the approved security design.", "depends_on": ["PG-064"]}, {"id": "PG-066", "area": "screens", "title": "Register page structure follows the owner's mockup", "status": "CONFIRMED", "confirmed_via": "interview", "value": "A split screen. Right side: a three-step progress bar (Account Type, Your Details, Complete); 'Create Your Account'; two account type cards, Individual and Business; Personal Information (full name, email, phone with +233, password with a show and hide control and a hint); Delivery Information (region, city or town, delivery address); an agree-to-terms tick box; a green Create Account button; and 'Already have an account? Sign In'. Step three is entering the emailed verification code.", "rationale": "Supplied by the owner as a register page mockup.", "depends_on": ["PG-064"]}, {"id": "PG-067", "area": "ux", "title": "Register details", "status": "PROPOSED", "value": "Business is chosen by the person and starts as unverified: no shared access or special pricing until staff confirm the organisation (CTL-ORG-001), and a Business sign-up also asks for the organisation's name. Passwords need at least 10 characters with no forced symbols, are checked against known leaked passwords and allow passphrases, instead of the mockup's 8 characters with a mix. Delivery information is not asked at sign-up: it is asked at checkout and saved in My Addresses, which collects less personal data. The terms tick box appears only once the Terms and Privacy Policy pages exist with real text (PG-054, DEC-005). The phone number is collected, but only the email is verified for now.", "rationale": "Follows the approved security design and the Data Protection Act principle of collecting only what is needed.", "depends_on": ["PG-066"]}, {"id": "PG-068", "area": "ux", "title": "Register sends confirmation emails", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Registering sends two emails. First, the verification code email for step three of the register page (the account is not usable until the code is entered). Second, once the code is confirmed, a confirmation email that says the account is ready, shows the name and email used, how to sign in, and how to contact Belis Bell. Emails never contain a password or a sign-in code in the confirmation, and they carry no links that sign someone in.", "rationale": "Owner asked for confirmation emails on register.", "depends_on": ["PG-066"]}, {"id": "PG-069", "area": "ux", "title": "Admins also sign in with an emailed code", "status": "CONFIRMED", "confirmed_via": "interview", "value": "Staff and the owner sign in with email and password and then an emailed 6-digit code, the same steps as customers. For staff a code lasts 5 minutes, works once, allows 5 wrong tries, and only a scrambled form is stored. This replaces the passkey or authenticator second step in the approved security baseline, which therefore needs a change and reapproval (baseline 0.4.0). A passkey or authenticator app for the owner account is recommended later, because an emailed code is only as safe as the mailbox that receives it.", "rationale": "Owner instruction: admin also gets email verification codes on login.", "depends_on": ["PG-062", "PG-064"]}], "conflicts": [], "directions": [{"id": "A", "name": "Paper and Teal", "tagline": "A calm supply catalogue with editorial polish.", "fit": "Matches your picks exactly: editorial, teal, soft elevation, top bar, trustworthy and premium. Feels like a well-run supplier that institutions trust, and still warm enough for households.", "tradeoffs": "Serif headings and airy spacing use more scroll length. Needs good product photography to earn the premium feel.", "preview": {"nav": "top", "density": 2, "radius": 10, "surface": "elevated", "serif": true, "palette": {"bg": "#f5f3ee", "surface": "#fffefb", "accent": "#0a6b6f", "ink": "#1c2422", "line": "#ddd8cc"}}, "foundation": {"Theme": "Light default, dark follows device", "Navigation": "Sticky top bar with category mega-menu", "Content width": "1240px max, centered", "Density": "Balanced", "Corner radius": "10px", "Typography": "Fraunces (headings) + Source Sans 3 (body)", "Primary interaction": "Category browse, product grid, add to cart or quote", "Mobile strategy": "Full parity, category drawer, sticky add-to-cart", "Animation": "Subtle, image fade and card lift, reduced-motion safe", "Icons": "Lucide"}, "tokens": {"color": {"bg": "#f5f3ee", "surface": "#fffefb", "border": "#ddd8cc", "text": "#1c2422", "muted": "#55605d", "primary": "#0a6b6f", "primary_contrast": "#ffffff", "success": "#0f6a3b", "warning": "#7a4700", "danger": "#a11d12"}, "color_dark": {"bg": "#0e1514", "surface": "#162120", "border": "#2a3837", "text": "#eaf1ef", "muted": "#9fb1ad", "primary": "#4fd1c5", "primary_contrast": "#06201d", "success": "#66d19a", "warning": "#f2c26b", "danger": "#ff9d92"}, "radius": {"sm": 6, "md": 10, "lg": 16}, "font": {"sans": "Source Sans 3, system-ui, sans-serif", "mono": "ui-monospace, SFMono-Regular, Menlo, monospace"}, "space": {"unit": 4}, "density": {"row_height": 44}}}, {"id": "B", "name": "Procurement Desk", "tagline": "Quote-first and built for institutional buyers.", "fit": "Puts Buy for Business at the centre: a sharper, denser catalogue with pack-size tables, saved lists and reorder. Best if institutions bring most of the revenue.", "tradeoffs": "Less editorial warmth; households may find it businesslike. Needs the account model decision to be answered as accounts.", "preview": {"nav": "top", "density": 3, "radius": 6, "surface": "elevated", "palette": {"bg": "#f3f6f7", "surface": "#ffffff", "accent": "#0b5f73", "ink": "#14212a", "line": "#d5dde0"}}, "foundation": {"Theme": "Light default, dark follows device", "Navigation": "Top bar plus persistent account and quote strip", "Content width": "1320px max", "Density": "Medium-high", "Corner radius": "6px", "Typography": "IBM Plex Sans + IBM Plex Serif for headings", "Primary interaction": "Product tables, bulk quantity entry, saved lists", "Mobile strategy": "Full parity, tables collapse to stacked rows", "Animation": "Functional only", "Icons": "Lucide"}, "tokens": {"color": {"bg y_contrast": "#ffffff", "success": "#0f6a3b", "warning": "#7a4700", "danger": "#a11d12"}, "color_dark": {"bg": "#0a1522", "surface": "#111f33", "border": "#22364f", "text": "#e7f0fa", "muted": "#a2b6cc", "primary": "#66d19a", "primary_contrast": "#04201d", "success": "#66d19a", "warning": "#f2c26b", "danger": "#ff9d92"}, "radius": {"sm": 8, "md": 12, "lg": 20}, "font": {"sans": "DM Sans, system-ui, sans-serif", "display": "Figtree, DM Sans, system-ui, sans-serif", "mono": "ui-monospace, SFMono-Regular, Menlo, monospace"}, "space": {"unit": 4}, "density": {"row_height": 44}}}], "selected_direction": "C", "risks": [{"id": "R-01", "severity": "high", "text": "High-stakes ordering with payments and institutional data means security must be designed before the first commit (payment handling, account access, quote data). Next gate: Opskeep/Elliot."}, {"id": "R-02", "severity": "med", "text": "Premium editorial look depends on real product photography. Weak or inconsistent photos undermine trust more than in a plain design."}, {"id": "R-03", "severity": "med", "text": "Extended accessibility scope (screen reader, low vision, multi-language and RTL) adds test effort across every screen."}, {"id": "R-04", "severity": "med", "text": "Payment, institutional account and price visibility decisions (PG-022 to PG-024) change checkout, accounts and data model. They must be answered before build."}, {"id": "R-05", "severity": "low", "text": "The reference site is another company's identity. Only its structure is borrowed; visuals and copy must be original."}, {"id": "R-06", "severity": "med", "text": "Following another company's visual style closely can look like a clone. Original logo, photography, wording and palette are required, and nothing may suggest affiliation."}, {"id": "R-07", "severity": "med", "text": "The logo is a raster with a light halo on white. It needs a transparent or SVG file and a compact header lockup before build."}, {"id": "R-08", "severity": "med", "text": in the cart, checkout, confirmation and account mockups are sample values. Nothing in them is real customer or order data."}, {"id": "AS-11", "text": "Names, emails, order counts, revenue and percentages in the admin and account mockups are sample values, not real data. The admin email admin@belisbell.com and the customer example addresses are placeholders and are never prefilled."}], "gate": {"status": "changes_requested", "history": [{"at": "2026-09-26T16:43:11Z", "event": "approved", "detail": "via dashboard"}, {"at": "2026-09-26T16:44:18Z", "event": "reopened", "detail": "PG-009, PG-017: Selected Fresh and Bright (not editorial) and asked to copy Supply Master's visual style and section arrangement, not content"}, {"at": "2026-09-26T16:47:52Z", "event": "approved", "detail": "via dashboard"}, {"at": "2026-09-26T16:50:00Z", "event": "reopened", "detail": "PG-010, PG-016: Belis Bell logo supplied: brand colours are blue (#006cbc, #044788) and green (#43b14a), not teal"}, {"at": "2026-09-26T16:52:07Z", "event": "approved", "detail": "via dashboard"}, {"at": "2026-09-26T16:58:03Z", "event": "reopened", "detail": "PG-030: Updated logo supplied: descriptor now 'Cleaning Supplies & More, for homes, businesses and institutions'"}, {"at": "2026-09-26T17:22:33Z", "event": "approved", "detail": "via dashboard"}, {"at": "2026-09-26T17:54:54Z", "event": "reopened", "detail": "PG-025, PG-013, PG-029: Owner supplied a home page mockup with its own structure, navigation and green buttons, and will supply all images"}, {"at": "2026-09-26T17:59:32Z", "event": "approved", "detail": "via dashboard"}, {"at": "2026-09-26T18:42:15Z", "event": "reopened", "detail": "PG-020: Owner supplied a single product page mockup and asked for bulk purchase ordering"}, {"at": "2026-09-26T18:47:03Z", "event": "approved", "detail": "via chat"}], "notes": "I like the way supply master visuals is. Dont copy the content but copy the visual style and the way the sections are arranged", "approved_at": "20
